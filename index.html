<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Almacén</title>
<style>
:root{
  --pri:#1f4e79; --pri-deep:#163a5b; --pri-soft:#e8f0f8; --acc:#e8a33d; --acc-soft:#fdf3e3;
  --ink:#1b1f24; --muted:#6b7280; --line:#e2e5e9; --soft:#f3f4f6; --bg:#f6f7f9; --card:#ffffff;
  --ok:#1e8e3e; --ok-soft:#e6f4ea; --warn:#a15c00; --warn-soft:#fff4e0; --bad:#c5221f; --bad-soft:#fce8e6; --info:#1a73e8;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --mono:Consolas,"SFMono-Regular",monospace;
  /* gráficos: paleta categórica de referencia (validada CVD, orden fijo) + polo negativo del par divergente */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --neg:#e34948; --grid:#e1e0d9; --axis:#c3c2b7; --ink2:#52514e; --ink3:#898781;
}
.viz{position:relative}
.viz svg{display:block;width:100%;height:auto}
.viz .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:150px;display:none;z-index:5}
.viz .tip b{display:block;margin-bottom:4px}
.viz .tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.lectura li{margin:4px 0}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg)}
header{background:var(--pri-deep);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.01em}
header .sub{color:#c9d6e3;font-size:12px}
header .spacer{flex:1}
.badge-file{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;background:transparent;color:#fff}
.badge-file.ok{border-color:#7fd19b}
.badge-file.mem{border-color:var(--acc);color:#ffd99a}
.layout{display:flex;min-height:calc(100vh - 50px)}
.sidebar{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:12px 0}
.sidebar .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 18px 6px}
.sidebar button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;padding:8px 18px;font:inherit;color:var(--ink);cursor:pointer;border-left:3px solid transparent}
.sidebar button:hover{background:var(--soft)}
.sidebar button.active{background:var(--pri-soft);color:var(--pri);border-left-color:var(--pri);font-weight:600}
.sidebar button.prox{color:#a0a6ad;cursor:default}
.sidebar button.prox:hover{background:transparent}
.sidebar .tag{font-size:10px;background:var(--soft);border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:500}
.sidebar .cnt{font-size:11px;background:var(--acc);color:#1b1f24;border-radius:999px;padding:0 7px;font-weight:700}
main{flex:1;padding:20px 24px;max-width:1600px;min-width:0}
h2{font-size:20px;margin:0 0 4px}
h3.sec{margin:0 0 10px;font-size:15px}
.desc{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field.w2{min-width:240px;flex:1}
.field.full{flex-basis:100%}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
input[readonly]{background:var(--soft);color:var(--muted)}
input.num{text-align:right}
textarea{resize:vertical;min-height:60px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:8px}
.btn{border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer;background:var(--pri);color:#fff}
.btn:hover{background:var(--pri-deep)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--soft)}
.btn.acc{background:var(--acc);color:#1b1f24}
.btn.ok{background:var(--ok)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#fafbfc}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:700;background:var(--soft)}
.tbl-wrap{overflow-x:auto}
.mono{font-family:var(--mono);font-size:12px}
.b{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b.ok{background:var(--ok-soft);color:var(--ok);border-color:#bfe3c9}
.b.warn{background:var(--warn-soft);color:var(--warn);border-color:#f3d7a6}
.b.bad{background:var(--bad-soft);color:var(--bad);border-color:#f3c3bf}
.b.info{background:var(--pri-soft);color:var(--pri);border-color:#c8dbee}
.b.mut{background:var(--soft);color:var(--muted);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi.link{cursor:pointer}
.kpi.link:hover{border-color:var(--pri)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:70px}
.progress > div{height:100%;background:var(--pri)}
.totales{display:flex;justify-content:flex-end}
.totales table{min-width:320px}
.totales td{padding:4px 10px}
.totales td.n{text-align:right;font-variant-numeric:tabular-nums}
.totales tr.tot td{font-weight:700;font-size:16px;border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:12px}
.wrn{color:var(--warn);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.alerta{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.alerta.warn{background:var(--warn-soft);border:1px solid #f3d7a6;color:#6b4100}
.alerta.bad{background:var(--bad-soft);border:1px solid #f3c3bf;color:#7a1512}
.alerta.info{background:var(--pri-soft);border:1px solid #c8dbee;color:var(--pri-deep)}
.alerta.ok{background:var(--ok-soft);border:1px solid #bfe3c9;color:#0f5223}
.empty{text-align:center;color:var(--muted);padding:28px}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:860px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-head button{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-body{padding:16px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hidden{display:none!important}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
#toast.show{opacity:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.gate{max-width:520px;margin:60px auto;text-align:center}
.datos{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.btn-menu{display:none;border:0;background:transparent;color:#fff;font-size:22px;padding:2px 6px;cursor:pointer}
.hdr-acc{display:flex;gap:6px}
.hdr-acc button{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px;font-size:12px;background:transparent;color:#fff;cursor:pointer}
#velo{display:none}
/* ---------- Celular y pantallas angostas ---------- */
@media (max-width:760px){
  body{font-size:15px}
  input,select,textarea{font-size:16px} /* evita el zoom automático de iOS al enfocar */
  header{padding:8px 12px;gap:8px}
  header h1{font-size:15px}
  header .sub{display:none}
  .btn-menu{display:block}
  .badge-file{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:40;overflow-y:auto;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.menu-abierto .sidebar{transform:none}
  body.menu-abierto #velo{display:block;position:fixed;inset:0;background:rgba(15,20,30,.35);z-index:35}
  .sidebar button{padding:11px 18px}
  main{padding:12px}
  h2{font-size:18px}
  .card{padding:12px;border-radius:10px}
  .row{gap:10px}
  .field{flex:1 1 140px;min-width:0}
  .field.w2{flex-basis:100%}
  .field input,.field select{width:100%!important}
  .toolbar > .btn,.toolbar > div > .btn{width:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:18px}
  .grid2{grid-template-columns:1fr}
  .datos{gap:12px}
  /* tablas: se deslizan de lado y la primera columna queda fija */
  .tbl-wrap{-webkit-overflow-scrolling:touch}
  .tbl-wrap table.t{min-width:640px}
  .tbl-wrap table.t th:first-child,.tbl-wrap table.t td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
  .tbl-wrap table.t th:first-child{background:var(--soft)}
  .tbl-wrap table.t tfoot td:first-child{background:var(--soft)}
  /* líneas de productos del formulario: una tarjeta por línea */
  #tabla-items{min-width:0!important}
  #tabla-items thead{display:none}
  #tabla-items tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  #tabla-items td{border:0;padding:0;position:static!important;box-shadow:none!important}
  #tabla-items td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  #tabla-items td.full-m{grid-column:1/-1}
  #tabla-items input{width:100%!important}
  .totales table{min-width:0;width:100%}
  .modal-bg{padding:0;align-items:stretch}
  .modal{border-radius:0;max-width:none;min-height:100%}
  .modal-body{overflow-x:auto}
  .modal-foot .btn{flex:1 1 auto}
  #toast{left:12px;right:12px;bottom:12px;text-align:center}
}
</style>
</head>
<body>
<header>
  <button class="btn-menu" aria-label="Menú" onclick="document.body.classList.toggle('menu-abierto')">☰</button>
  <div>
    <h1 id="h-empresa">Sistema de Almacén</h1>
    <div class="sub">Almacén · Compras · Ventas · Gastos · Resultados</div>
  </div>
  <div class="spacer"></div>
  <div class="hdr-acc" id="hdr-acc"></div>
  <button class="badge-file" id="badge-file" onclick="ir('archivo')">…</button>
</header>
<div id="velo" onclick="document.body.classList.remove('menu-abierto')"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="modal-bg" class="modal-bg hidden" onmousedown="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-tit"></h3><button onclick="cerrarModal()">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="input-import" accept=".json,application/json" class="hidden" onchange="leerArchivoImportacion(this)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* =====================================================================
   SISTEMA DE ALMACÉN — Fases 1 y 2
   Maestros · Pedidos a proveedor (entregas parciales, precio pactado)
   Entradas (factura de compra) · Salidas (factura/boleta de venta)
   Ajustes de inventario (aprobación con PIN) · Stock · Reposición · Kardex
   Kardex = costo promedio ponderado en soles sin IGV · Archivo JSON
   ===================================================================== */

const VERSION_ESQUEMA = 4;
const LS_KEY = 'almacen_db_v1';
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const EPS = 1e-9;
const DIAS_CONSUMO = 90;      // ventana para calcular el consumo promedio diario
const TOLERANCIA_PRECIO = 0.005; // 0.5% de diferencia factura vs pactado antes de avisar
const MOTIVOS_AJUSTE = [
  {m:'Faltante de conteo', s:-1}, {m:'Merma', s:-1}, {m:'Rotura / daño', s:-1}, {m:'Robo / pérdida', s:-1},
  {m:'Consumo interno', s:-1}, {m:'Muestra / obsequio', s:-1}, {m:'Préstamo no devuelto', s:-1}, {m:'Otro egreso', s:-1},
  {m:'Sobrante de conteo', s:1}, {m:'Otro ingreso', s:1},
];
const signoMotivo = m => (MOTIVOS_AJUSTE.find(x=>x.m===m)||{s:-1}).s;
// Líneas fijas del Estado de Resultados; cada categoría de gasto (editable) apunta a una de ellas.
const LINEAS_EERR = {personal:'Gastos de personal', combustible:'Combustible y viáticos', alquiler:'Alquiler y servicios', otros:'Otros gastos operativos', financieros:'Gastos financieros', inversion:'Inversión / implementación (no es gasto del EERR)'};
const LINEAS_OPERATIVAS = ['personal','combustible','alquiler','otros'];
const CATEGORIAS_GASTO_DEFAULT = [
  {nombre:'Sueldos y salarios', linea:'personal'}, {nombre:'Cargas sociales (EsSalud, AFP/ONP)', linea:'personal'}, {nombre:'Gratificaciones y CTS', linea:'personal'},
  {nombre:'Combustible', linea:'combustible'}, {nombre:'Viáticos y movilidad', linea:'combustible'},
  {nombre:'Alquiler', linea:'alquiler'}, {nombre:'Servicios (luz, agua, internet, teléfono)', linea:'alquiler'},
  {nombre:'Mantenimiento y reparaciones', linea:'otros'}, {nombre:'Útiles y suministros', linea:'otros'}, {nombre:'Otros gastos', linea:'otros'},
  {nombre:'Comisiones e intereses bancarios', linea:'financieros'},
  {nombre:'Implementación / equipamiento', linea:'inversion'},
];
const COMPROBANTES_GASTO = ['Factura','Boleta','Recibo por honorarios','Planilla','Ticket','Sin comprobante'];
const MEDIOS_PAGO = ['Transferencia','Efectivo','Depósito','Yape / Plin','Tarjeta','Cheque'];
// Movimientos de caja que no son ventas, compras ni gastos (no afectan el Estado de resultados).
const TIPOS_MOVCAJA = [
  {t:'Aporte de socios', s:1}, {t:'Préstamo recibido', s:1}, {t:'Otros ingresos de caja', s:1},
  {t:'Pago de IGV a SUNAT', s:-1}, {t:'Pago de renta / pagos a cuenta', s:-1}, {t:'Otros tributos (detracciones, multas)', s:-1},
  {t:'Pago de préstamo (capital)', s:-1}, {t:'Retiro de socios / dividendos', s:-1}, {t:'Otros egresos de caja', s:-1},
];
const signoMovCaja = t => (TIPOS_MOVCAJA.find(x=>x.t===t)||{s:-1}).s;

let db = null;
let fileHandle = null;
let fileLastMod = 0;
let estadoArchivo = 'memoria'; // 'archivo' | 'reconectar' | 'memoria'
let vista = 'inicio';
let formE = null, formS = null, formP = null, formA = null;
let filtE = filtroMesActual(), filtS = filtroMesActual();
let filtP = {anio:'', mes:'', estado:'abiertos', proveedor:'', texto:''};
let filtA = {anio:'', mes:'', estado:''};
let filtStock = {texto:'', categoria:'', proveedor:'', soloBajo:false, conStock:false};
let filtKardex = {producto:'', desde:'', hasta:''};
let filtInicio = {anio:new Date().getFullYear(), mes:new Date().getMonth()+1};
let filtProd = {texto:'', inactivos:false};
let filtG = {...filtroMesActual(), estado:'Activo', categoria:''};
let filtCx = {tercero:''};
let anioEERR = new Date().getFullYear(), anioFlujo = new Date().getFullYear();
let formPR = null, filtPR = {estado:'abiertos', proveedor:''}, filtMC = {anio:new Date().getFullYear(), mes:''};
let filtInd = {anio:new Date().getFullYear(), mes:''};
let repTodos = false, sugEdit = {};
let importPendiente = null, importArmado = false, borrarArmado = false;

/* ---------------------------- utilidades ---------------------------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ja(v){ return esc(JSON.stringify(v)); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function r4(n){ return Math.round((n + Number.EPSILON) * 10000) / 10000; }
function fmt(n, dec=2){ return (n||0).toLocaleString('es-PE',{minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtQ(n){ return (n||0).toLocaleString('es-PE',{maximumFractionDigits:2}); }
function money(n, mon='PEN'){ return (mon==='USD'?'US$ ':'S/ ') + fmt(n); }
function isoDe(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function hoyISO(){ return isoDe(new Date()); }
function sumarDias(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
function diasEntre(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function filtroMesActual(){ const d=new Date(); return {anio:d.getFullYear(), mes:d.getMonth()+1, texto:'', estado:'Activa'}; }
function prefijoPeriodo(anio, mes){ return !anio ? '' : mes ? `${anio}-${String(mes).padStart(2,'0')}` : `${anio}-`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function claveComprobante(serie, numero){ const n=parseInt(numero,10); return `${String(serie).trim().toUpperCase()}-${isNaN(n)?String(numero).trim():n}`; }
function aniosDisponibles(){
  const s = new Set([new Date().getFullYear()]);
  [db.entradas, db.salidas, db.pedidos, db.ajustes, db.gastos, db.prestamos, db.movcaja].forEach(c=>Object.values(c).forEach(d=>s.add(parseInt(d.fecha.slice(0,4),10))));
  return [...s].sort((a,b)=>b-a);
}
function optsAnio(sel, conTodos=false){ return (conTodos?`<option value="" ${!sel?'selected':''}>Todos</option>`:'') + aniosDisponibles().map(a=>`<option value="${a}" ${a==sel?'selected':''}>${a}</option>`).join(''); }
function optsMes(sel, conTodos=true){ return (conTodos?`<option value="" ${!sel?'selected':''}>Todos</option>`:'') + MESES.map((m,i)=>`<option value="${i+1}" ${i+1==sel?'selected':''}>${m}</option>`).join(''); }
function descargarCSV(nombre, encabezados, filas){
  const q = v => { const s=String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const txt = '﻿' + [encabezados, ...filas].map(f=>f.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download = nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// Buscador que re-renderiza sin perder el foco del input (clase .w2b)
function buscadorHTML(label, valor, setter, render){

/* ---------------------------- base de datos ---------------------------- */
function dbVacia(){
  const ahora = new Date().toISOString();
  return {
    version: VERSION_ESQUEMA, creado: ahora, actualizado: ahora,
    config: { empresa:'Mi Empresa', ruc:'', igv_pct:18, tc_default:3.75,
              unidades:['UND','CAJA','PAQ','KG','LT','MT','PAR','JGO'], categorias:['General'], series_venta:['F001','B001'],
              dias_seguridad:7, dias_cobertura:30, pin_hash:'',
              categorias_gasto: CATEGORIAS_GASTO_DEFAULT.map(c=>({...c})), saldo_inicial_caja: {} },
    correlativos: { ENT:0, SAL:0, OC:0, AJU:0, GAS:0, PRE:0, MCJ:0 },
    productos: {}, proveedores: {}, clientes: {}, pedidos: {}, entradas: {}, salidas: {}, ajustes: {}, gastos: {}, prestamos: {}, movcaja: {}
  };
}
function migrar(d){
  const base = dbVacia();
  d = d || {};
  for(const k of Object.keys(base)) if(d[k] === undefined) d[k] = base[k];
  d.config = Object.assign({}, base.config, d.config||{});
  d.correlativos = Object.assign({}, base.correlativos, d.correlativos||{});
  d.version = VERSION_ESQUEMA;
  return d;
}
function siguienteCodigoLocal(pref){ db.correlativos[pref] = (db.correlativos[pref]||0) + 1; return `${pref}-${String(db.correlativos[pref]).padStart(6,'0')}`; }
// En la nube el correlativo lo entrega la base (función atómica), así PC y celular nunca repiten un número.
async function siguienteCodigo(pref){
  if(!NUBE) return siguienteCodigoLocal(pref);
  const {data, error} = await sb.rpc('siguiente_correlativo', {p_prefijo: pref});
  if(error) throw new Error('No se pudo obtener el número correlativo (¿sin conexión?). No se guardó nada; intenta de nuevo.');
  db.correlativos[pref] = Math.max(db.correlativos[pref]||0, data);
  return `${pref}-${String(data).padStart(6,'0')}`;
}

/* --- persistencia: archivo JSON (File System Access API) + copia en el navegador --- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('almacen_handles',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction('h','readwrite'); if(v===null) t.objectStore('h').delete(k); else t.objectStore('h').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction('h','readonly'); const q=t.objectStore('h').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }

  db.actualizado = new Date().toISOString();

  const contenido = JSON.stringify(db, null, 1);
  colaGuardado = colaGuardado.then(async ()=>{

    if(fileLastMod && f.lastModified > fileLastMod + 2000){
      if(!confirm('El archivo de datos fue modificado desde otro lugar (otra pestaña, otra PC u OneDrive) después de que lo abriste.\n\n¿Sobrescribirlo con lo que tienes en esta pantalla?\n\nCancelar = no guardar en el archivo (tu cambio queda solo en este navegador).')) return;

// Huella de lo que ya está en la nube, para enviar solo los registros que cambiaron.
function tomarSnapshot(d){
  const s = {config: JSON.stringify(d.config)};
  COLECCIONES.forEach(c=>{ s[c] = {}; for(const id in d[c]) s[c][id] = JSON.stringify(d[c][id]); });
  return s;
}
function diffNube(){
  const ups = [], dels = [];
  COLECCIONES.forEach(c=>{
    const s = snapNube[c] || {};
    for(const id in db[c]){ const j = JSON.stringify(db[c][id]); if(s[id] !== j) ups.push({coleccion:c, id, datos:db[c][id], json:j}); }
    for(const id in s) if(!(id in db[c])) dels.push({coleccion:c, id});
  });
  const cfg = JSON.stringify(db.config);
  return {ups, dels, cfg: cfg !== snapNube.config ? cfg : null};
}
const hayCambiosSinSubir = () => NUBE && snapNube && (()=>{ const d = diffNube(); return d.ups.length || d.dels.length || d.cfg!==null; })();

async function cargarNube(){
  const d = dbVacia();
  const paso = 1000; // PostgREST devuelve como máximo 1000 filas por consulta: se pagina
  for(let desde = 0; ; desde += paso){
    const {data, error} = await sb.from('registros').select('coleccion,id,datos').order('coleccion').order('id').range(desde, desde+paso-1);
    if(error) throw error;
    data.forEach(r=>{ if(d[r.coleccion]) d[r.coleccion][r.id] = r.datos; });
    if(data.length < paso) break;
  }
  const [cfg, cor] = await Promise.all([sb.from('configuracion').select('datos').maybeSingle(), sb.from('correlativos').select('prefijo,ultimo')]);
  if(cfg.error) throw cfg.error;
  if(cor.error) throw cor.error;
  if(cfg.data?.datos) d.config = cfg.data.datos;
  (cor.data||[]).forEach(c=>d.correlativos[c.prefijo] = c.ultimo);
  db = migrar(d); snapNube = tomarSnapshot(db); ultimaCarga = Date.now();
}

  pendientesNube++; setEstadoNube('guardando');
  colaNube = colaNube.then(()=>sincronizarNube(msg)).finally(()=>{ pendientesNube--; if(!pendientesNube && nubeEstado==='guardando') setEstadoNube('ok'); });
  return colaNube;
}
// Envía los cambios (upsert por registro + borrados) y reintenta con esperas crecientes si no hay conexión.
async function sincronizarNube(msg){
  const esperas = [1000, 2000, 4000, 8000, 15000];
  for(let intento = 0; ; intento++){
    try{
      const {ups, dels, cfg} = diffNube();
      if(ups.length || dels.length || cfg!==null){
        const tareas = [];
        for(let i=0; i<ups.length; i+=500) tareas.push(sb.from('registros').upsert(ups.slice(i,i+500).map(u=>({coleccion:u.coleccion, id:u.id, datos:u.datos})), {onConflict:'coleccion,id'}));
        const porCol = {}; dels.forEach(x=>(porCol[x.coleccion] = porCol[x.coleccion] || []).push(x.id));
        for(const c in porCol) for(let i=0; i<porCol[c].length; i+=150) tareas.push(sb.from('registros').delete().eq('coleccion', c).in('id', porCol[c].slice(i,i+150)));
        if(cfg!==null) tareas.push(sb.from('configuracion').upsert({id:true, datos:db.config}));
        const res = await Promise.all(tareas), mal = res.find(r=>r.error);
        if(mal) throw mal.error;
        ups.forEach(u=>snapNube[u.coleccion][u.id] = u.json); dels.forEach(x=>delete snapNube[x.coleccion][x.id]); if(cfg!==null) snapNube.config = cfg;
      }
      if(nubeEstado==='error') setEstadoNube('guardando');
      toast(msg); return;
    }catch(e){
      console.warn('Error al guardar en la nube', e);
      if(/JWT|jwt|401|not authenticated|permission denied|42501/.test(e?.message||e?.code||'')){ setEstadoNube('error'); alert('Tu sesión venció o no tienes permiso. Vuelve a ingresar; tus cambios siguen en esta pantalla y se enviarán después.'); return; }
      setEstadoNube('error');
      if(intento >= esperas.length){ toast('Sin conexión: los cambios se enviarán al reconectar'); return; }
      await esperar(esperas[intento]);
    }
  }
}

// Control "blando": evita aprobaciones accidentales o de otra persona en la misma PC.
// No es seguridad criptográfica real: quien tenga el archivo JSON puede editarlo a mano.
async function hashPin(pin){
  const txt = 'almacen-pin:' + pin;
  if(window.crypto?.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(const c of txt) h = ((h<<5)+h+c.charCodeAt(0))|0; return 'd'+h;
}
// Abre un modal que exige el PIN antes de ejecutar una de las acciones.

/* ---------------------------- cálculo de documentos ---------------------------- */
// Devuelve ítems con valor unitario SIN IGV (en moneda del documento y en soles) + totales.
function calcularDoc(f){
  const pct = num(db.config.igv_pct)/100;
  const tc = f.moneda==='USD' ? num(f.tc) : 1;
  let base = 0;
  const items = f.items.map(it=>{
    const q = num(it.cantidad), p = num(it.precio);
    const vu = (f.afecto_igv && f.incluye_igv) ? p/(1+pct) : p;
    const vt = q*vu; base += vt;
    return { producto: it.producto, cantidad: q, precio: p, valor_unit: vu, valor_total: r2(vt), valor_unit_pen: vu*tc };
  });
  let igv, total;
  if(f.afecto_igv && f.incluye_igv){
    // precios con IGV: el total manda (lo que dice el comprobante) y la base sale por diferencia
    total = r2(items.reduce((a,it)=>a+it.cantidad*it.precio,0));
    base = r2(total/(1+pct)); igv = r2(total-base);
  } else {
    base = r2(base); igv = f.afecto_igv ? r2(base*pct) : 0; total = r2(base+igv);
  }
  return { items, base, igv, total, tc, base_pen: r2(base*tc), igv_pen: r2(igv*tc), total_pen: r2(total*tc) };
}

/* ---------------------------- pedidos a proveedor ---------------------------- */
// Cantidades recibidas por pedido y producto, según entradas activas vinculadas.
function recibidoPorPedido(){
  const r = {};
  for(const e of Object.values(db.entradas)){
    if(e.estado==='Anulada' || !e.pedido) continue;
    const m = r[e.pedido] = r[e.pedido] || {};
    e.items.forEach(it=> m[it.producto] = (m[it.producto]||0) + it.cantidad);
  }
  return r;
}
// Estado derivado: Anulado/Cerrado son manuales; Pendiente/Parcial/Completo se calculan con lo recibido.
function estadoPedido(p, rec){
  if(p.estado==='Anulado') return 'Anulado';
  const r = rec[p.codigo] || {};
  if(p.items.every(it=>(r[it.producto]||0) >= it.cantidad - EPS)) return 'Completo';
  if(p.estado==='Cerrado') return 'Cerrado';
  return p.items.some(it=>(r[it.producto]||0) > EPS) ? 'Parcial' : 'Pendiente';
}
const pedidoAbierto = (p, rec) => ['Pendiente','Parcial'].includes(estadoPedido(p, rec));
function pendienteLinea(p, producto, rec){
  const li = p.items.find(x=>x.producto===producto); if(!li) return 0;
  return Math.max(0, li.cantidad - ((rec[p.codigo]||{})[producto]||0));
}
function pedidosAbiertos(){ const rec = recibidoPorPedido(); return Object.values(db.pedidos).filter(p=>pedidoAbierto(p,rec)).sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
function enPedidoPorProducto(){
  const rec = recibidoPorPedido(), out = {};
  for(const p of Object.values(db.pedidos)) if(pedidoAbierto(p,rec)) p.items.forEach(it=> out[it.producto] = (out[it.producto]||0) + pendienteLinea(p, it.producto, rec));
  return out;
}
function valorPendientePedido(p, rec){ return p.items.reduce((a,it)=>a + pendienteLinea(p,it.producto,rec)*it.precio_pactado,0) * (p.moneda==='USD'?p.tc:1); }
function badgeEstadoPedido(est){ return {Pendiente:'info', Parcial:'warn', Completo:'ok', Cerrado:'mut', Anulado:'bad'}[est]; }
function badgeAtraso(p, rec){
  if(!p.fecha_entrega || !pedidoAbierto(p, rec)) return '';
  const d = diasEntre(p.fecha_entrega, hoyISO());
  return d > 0 ? ` <span class="b bad" title="Pasó la fecha de entrega comprometida">Atrasado ${d} d</span>` : '';
}
// Diferencia % entre el valor facturado (sin IGV) y el pactado; compara en soles si las monedas difieren.
function difPrecioPct(vuFactura, monedaFactura, tcFactura, pedido, pactado){
  if(!(pactado>0)) return 0;
  if(monedaFactura===pedido.moneda) return vuFactura/pactado - 1;
  const fPen = vuFactura * (monedaFactura==='USD'?num(tcFactura):1), pPen = pactado * (pedido.moneda==='USD'?num(pedido.tc):1);
  return pPen>0 ? fPen/pPen - 1 : 0;
}

/* ---------------------------- kardex (costo promedio ponderado) ---------------------------- */
// Movimientos por producto desde documentos activos y ajustes aprobados, ordenados por fecha;
// el mismo día: entradas, luego ajustes, luego salidas.
function construirMovimientos(d){
  const m = {};
  const push = (cod, mv) => (m[cod] = m[cod] || []).push(mv);
  for(const e of Object.values(d.entradas)){
    if(e.estado==='Anulada') continue;
    e.items.forEach(it=>push(it.producto,{fecha:e.fecha, orden:0, creado:e.creado, tipo:'E', signo:1, doc:e.codigo, comp:`${e.serie}-${e.numero}`, tercero:nombreProveedor(e.proveedor), terceroId:e.proveedor, cantidad:it.cantidad, costo_unit:it.valor_unit_pen}));
  }
  for(const a of Object.values(d.ajustes||{})){
    if(a.estado!=='Aprobado') continue;
    a.items.forEach(it=>push(it.producto,{fecha:a.fecha, orden:1, creado:a.creado, tipo:'A', signo:a.signo, doc:a.codigo, comp:a.codigo, tercero:'Ajuste: '+a.motivo, cantidad:it.cantidad}));
  }
  for(const s of Object.values(d.salidas)){
    if(s.estado==='Anulada') continue;
    s.items.forEach(it=>push(it.producto,{fecha:s.fecha, orden:2, creado:s.creado, tipo:'S', signo:-1, doc:s.codigo, comp:`${s.serie}-${s.numero}`, tercero:nombreCliente(s.cliente), cantidad:it.cantidad, precio_unit:it.valor_unit_pen}));
  }
  for(const k in m) m[k].sort((a,b)=> a.fecha.localeCompare(b.fecha) || a.orden-b.orden || String(a.creado).localeCompare(String(b.creado)));
  return m;
}
function correrKardex(movs){
  let cant=0, val=0, ultProm=0, primerNeg=null;
  const filas = (movs||[]).map(mv=>{
    let costoU, costoT;
    if(mv.signo > 0){
      // Entrada a su costo; un ajuste positivo (sobrante) entra al costo promedio vigente.
      costoU = mv.tipo==='E' ? mv.costo_unit : (cant>EPS ? val/cant : ultProm);
      costoT = mv.cantidad*costoU; cant += mv.cantidad; val += costoT;
    } else {
      costoU = cant>EPS ? val/cant : ultProm; costoT = costoU*mv.cantidad; cant -= mv.cantidad; val -= costoT;
    }
    if(Math.abs(cant)<EPS){ cant=0; val=0; }
    if(cant>EPS) ultProm = val/cant;
    if(cant<-EPS && !primerNeg) primerNeg={fecha:mv.fecha, cant};
    return {...mv, costoU, costoT, saldoCant:cant, saldoVal:val, costoProm: cant>EPS ? val/cant : 0};
  });
  return {filas, cant, val, costoProm: cant>EPS ? val/cant : 0, ultProm, primerNeg};
}
function calcularStock(){
  const movs = construirMovimientos(db);
  const res = {};
  for(const cod of Object.keys(db.productos)){
    const k = correrKardex(movs[cod]);
    const ent = (movs[cod]||[]).filter(x=>x.tipo==='E'), sal=(movs[cod]||[]).filter(x=>x.tipo==='S');
    res[cod] = { cant:k.cant, val:k.val, costoProm:k.costoProm, ultProm:k.ultProm,
      ultEntrada: ent.length ? ent[ent.length-1].fecha : '', ultSalida: sal.length ? sal[sal.length-1].fecha : '',
      ultProveedor: ent.length ? ent[ent.length-1].terceroId : '', ultCosto: ent.length ? ent[ent.length-1].costo_unit : 0,
      proveedores: [...new Set(ent.map(x=>x.terceroId))] };
  }
  return res;
}
// Costo (S/) de cada salida y de cada ajuste aprobado, según el kardex.
function costosPorDoc(){
  const movs = construirMovimientos(db), out = {};
  for(const cod in movs) for(const f of correrKardex(movs[cod]).filas) if(f.tipo!=='E') out[f.doc] = (out[f.doc]||0) + f.costoT;
  return out;
}
// Simula la base con un cambio y devuelve errores de stock negativo para los productos indicados.
function validarStockSimulado(dSim, productos){
  const movs = construirMovimientos(dSim), errores = [];
  for(const cod of new Set(productos)){
    const k = correrKardex(movs[cod]);
    if(k.primerNeg) errores.push(`${cod} — ${descProducto(cod)}: el stock quedaría en ${fmtQ(k.primerNeg.cant)} el ${fmtFecha(k.primerNeg.fecha)}.`);
  }
  return errores;
}

/* ---------------------------- reposición sugerida ---------------------------- */
// Punto de reorden = consumo diario × (días de entrega del proveedor + días de seguridad).
// Se sugiere pedir cuando (stock + en pedido) ≤ máx(punto de reorden, stock mínimo);
// la cantidad sugerida lleva el proyectado hasta ese umbral + consumo × días de cobertura.
function calcularReposicion(){
  const stock = calcularStock(), enPed = enPedidoPorProducto();
  const desde = sumarDias(hoyISO(), -DIAS_CONSUMO), consumo = {};
  for(const s of Object.values(db.salidas)){
    if(s.estado==='Anulada' || s.fecha < desde) continue;
    s.items.forEach(it=> consumo[it.producto] = (consumo[it.producto]||0) + it.cantidad);
  }
  const seg = num(db.config.dias_seguridad), cob = num(db.config.dias_cobertura), res = {};
  for(const p of productosActivos()){
    const s = stock[p.codigo], prov = p.proveedor || s.ultProveedor || '';
    const lead = num(db.proveedores[prov]?.dias_entrega);
    const cd = (consumo[p.codigo]||0) / DIAS_CONSUMO;
    const reorden = cd*(lead+seg), umbral = Math.max(reorden, num(p.stock_min));
    const ep = enPed[p.codigo]||0, proy = s.cant + ep;
    const sugerido = (umbral>EPS && proy <= umbral + EPS) ? Math.max(0, Math.ceil(umbral + cd*cob - proy - EPS)) : 0;
    res[p.codigo] = { stock:s.cant, enPedido:ep, proyectado:proy, consumoDia:cd, cobertura: cd>0 ? s.cant/cd : null,
      lead, reorden, minimo:num(p.stock_min), umbral, sugerido, proveedor:prov, costoRef: s.ultCosto || s.costoProm };
  }
  return res;
}

function exportarDocsCSV(tipo){
  const E = tipo==='E', f = E?filtE:filtS, pref = prefijoPeriodo(f.anio,f.mes), filas=[];
  Object.values(E?db.entradas:db.salidas).filter(d=>(!pref||d.fecha.startsWith(pref)) && (!f.estado||d.estado===f.estado))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(d=>{
      d.items.forEach(it=>filas.push([d.fecha, d.codigo, E?'Factura':(d.comprobante||'Factura'), d.serie, d.numero, E?d.proveedor:d.cliente, E?nombreProveedor(d.proveedor):nombreCliente(d.cliente),
        E?(d.pedido||''):'', it.producto, descProducto(it.producto), it.cantidad, d.moneda, d.tc, r4(it.valor_unit), E&&it.precio_pactado!=null?r4(it.precio_pactado):'', it.valor_total, r2(it.valor_total*d.tc), d.estado]));
    });
  descargarCSV(`${E?'entradas':'salidas'}_${pref||'todo'}.csv`, ['Fecha','Código','Comprobante','Serie','Número', E?'RUC proveedor':'Doc. cliente', E?'Proveedor':'Cliente','Pedido','Cód. producto','Producto','Cantidad','Moneda','T.C.','Valor unit. sin IGV','Pactado unit. (moneda pedido)','Subtotal sin IGV','Subtotal S/','Estado'], filas);
}

  const body = `
    ${d.estado==='Anulada' ? `<div class="alerta bad"><b>Anulada</b> el ${fmtFecha(d.anulacion?.fecha)} — ${esc(d.anulacion?.motivo)}</div>`:''}
    <div class="datos">
      <div><div class="hint">Fecha</div><b>${fmtFecha(d.fecha)}</b></div>
      <div><div class="hint">${E?'Factura de compra':esc(d.comprobante||'Factura')}</div><b class="mono">${esc(d.serie)}-${esc(d.numero)}</b></div>
      <div><div class="hint">${E?'Proveedor':'Cliente'}</div><b>${esc(E?nombreProveedor(d.proveedor):nombreCliente(d.cliente))}</b> <span class="hint">${esc(E?d.proveedor:d.cliente)}</span></div>
      <div><div class="hint">Moneda</div><b>${mon==='USD'?`US$ · T.C. ${fmt(d.tc,3)}`:'Soles'}</b></div>
      ${ped?`<div><div class="hint">Pedido</div><a href="#" class="mono" onclick="verPedido(${ja(ped.codigo)});return false">${esc(ped.codigo)}</a></div>`:''}
    </div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Producto</th><th class="n">Cant.</th><th class="n">${E?'Costo':'Precio'} unit. s/IGV</th>${ped?'<th class="n">Pactado</th><th class="n">Dif.</th>':''}<th class="n">Subtotal</th>${mon==='USD'?'<th class="n">Subtotal S/</th>':''}</tr></thead><tbody>
      ${d.items.map(it=>{ const dif = ped && it.precio_pactado!=null ? difPrecioPct(it.valor_unit, d.moneda, d.tc, ped, it.precio_pactado) : null;
        return `<tr><td><span class="mono">${esc(it.producto)}</span> ${esc(descProducto(it.producto))}</td><td class="n">${fmtQ(it.cantidad)}</td><td class="n">${fmt(it.valor_unit,4)}</td>
        ${ped?`<td class="n">${it.precio_pactado!=null?fmt(it.precio_pactado,4):'<span class="wrn">fuera del pedido</span>'}</td><td class="n">${dif==null?'':`<span class="${Math.abs(dif)>TOLERANCIA_PRECIO?(dif>0?'err':'wrn'):''}">${dif>0?'+':''}${fmt(dif*100,1)}%</span>`}</td>`:''}
        <td class="n">${fmt(it.valor_total)}</td>${mon==='USD'?`<td class="n">${fmt(it.valor_total*d.tc)}</td>`:''}</tr>`; }).join('')}
    </tbody></table></div>
    <div class="totales" style="margin-top:10px"><table>
      <tr><td>Valor ${E?'de compra':'de venta'} (base)</td><td class="n">${money(d.base,mon)}</td></tr>
      <tr><td>IGV ${d.afecto_igv?fmtQ(d.igv_pct)+'%':'(no afecto)'}</td><td class="n">${money(d.igv,mon)}</td></tr>
      <tr class="tot"><td>Total</td><td class="n">${money(d.total,mon)}</td></tr>
      ${mon==='USD'?`<tr><td class="hint">Equivalente en soles</td><td class="n hint">${money(d.total_pen)}</td></tr>`:''}
      ${!E && d.estado!=='Anulada' ? `<tr><td class="hint">Costo de lo vendido</td><td class="n hint">${money(costos[d.codigo]||0)}</td></tr><tr><td class="hint">Margen bruto</td><td class="n hint">${money(d.base_pen-(costos[d.codigo]||0))}</td></tr>`:''}

    ${d.observacion ? `<p><span class="hint">Observación:</span> ${esc(d.observacion)}</p>`:''}
    <p class="hint">Registrado ${new Date(d.creado).toLocaleString('es-PE')} · ${esc(d.codigo)}</p>`;
  const foot = (esCredito(d) && saldoDoc(d)>0.005 ? `<button class="btn ok" onclick="modalPago('${E?'entradas':'salidas'}',${ja(codigo)})">Registrar ${E?'pago':'cobro'}</button>` : '')
    + (d.estado!=='Anulada' ? `<button class="btn danger" onclick="pedirAnulacion('${tipo}',${ja(codigo)})">Anular documento</button>` : '') + `<button class="btn sec" onclick="cerrarModal()">Cerrar</button>`;
  abrirModal(`${E?'Entrada':'Salida'} ${codigo}`, body, foot);
}
function pedirAnulacion(tipo, codigo){
  const d = (tipo==='E'?db.entradas:db.salidas)[codigo];
  modalMotivo(`Anular ${codigo}`,
    `<div class="alerta warn">El documento no se borra: queda marcado como <b>Anulado</b> con su motivo, y deja de afectar el stock y los reportes${tipo==='E'&&d.pedido?` (y lo recibido del pedido ${esc(d.pedido)} vuelve a quedar pendiente)`:''}. Si había un error, anúlalo y registra el documento correcto.</div>
     <p>Comprobante <b class="mono">${esc(d.serie)}-${esc(d.numero)}</b> · ${money(d.total,d.moneda)}</p>`,
    'Confirmar anulación', 'danger', motivo => {
      if(pagosActivos(d).length) return `Este documento tiene ${tipo==='E'?'pagos':'cobros'} registrados. Anúlalos primero (en el detalle del documento).`;
      if(tipo==='E'){
        const sim = {...db, entradas:{...db.entradas, [codigo]:{...d, estado:'Anulada'}}};
        const errores = validarStockSimulado(sim, d.items.map(i=>i.producto));
        if(errores.length) return 'No se puede anular: parte de esta mercadería ya salió.<br>' + errores.map(esc).join('<br>') + '<br>Anula primero las salidas relacionadas.';
        const errP = erroresDisponible(sim, enPrestamoPorProducto(), d.items.map(i=>i.producto));
        if(errP.length) return 'No se puede anular: ' + errP.map(esc).join('<br>');
      }
      d.estado = 'Anulada'; d.anulacion = {fecha:new Date().toISOString(), motivo};
      guardar('Documento anulado');
    });
}

const itemVacio = () => ({producto:'', cantidad:'', precio:''});
function nuevoForm(tipo){
  const f = { tipo, fecha:hoyISO(), tercero:'', comprobante:'Factura',
    serie: tipo==='S' ? (db.config.series_venta[0]||'F001') : '', numero:'',
    moneda:'PEN', tc:db.config.tc_default, afecto_igv:true, incluye_igv:false, observacion:'', items:[itemVacio()] };
  if(tipo==='E') f.pedido = '';
  if(tipo==='P') f.fecha_entrega = '';
  if(tipo!=='P'){ f.condicion = 'Contado'; f.dias_credito = '30'; }
  return f;
}
function getForm(t){ return t==='E' ? formE : t==='S' ? formS : formP; }
function setForm(t, v){ if(t==='E') formE=v; else if(t==='S') formS=v; else formP=v; }

function setTercero(t, v){
  const f = getForm(t); f.tercero = v;
  if(t==='E' && f.pedido && db.pedidos[f.pedido]?.proveedor !== v) f.pedido = '';
  if(t==='P' && db.proveedores[v] && num(db.proveedores[v].dias_entrega)>0) f.fecha_entrega = sumarDias(f.fecha, num(db.proveedores[v].dias_entrega));
  renderFormDoc(t);
}
// Vincula la entrada a un pedido: precarga lo pendiente con el precio pactado.
function vincularPedido(cod, render=true){
  const f = formE;
  if(!cod){ f.pedido=''; if(render) renderFormDoc('E'); return; }
  const p = db.pedidos[cod], rec = recibidoPorPedido();
  f.pedido = cod; f.tercero = p.proveedor; f.moneda = p.moneda; f.afecto_igv = p.afecto_igv; f.incluye_igv = false;
  if(p.moneda==='USD') f.tc = p.tc || f.tc;
  f.items = p.items.map(it=>({producto:it.producto, cantidad:String(r4(pendienteLinea(p,it.producto,rec))), precio:String(r4(it.precio_pactado))})).filter(it=>num(it.cantidad)>EPS);
  if(!f.items.length) f.items = [itemVacio()];
  if(render) renderFormDoc('E');
}

// Avisos por línea. Devuelve [{i, nivel:'err'|'wrn', msg}] — también se usa al guardar.
function avisosLineas(tipo, f, c){
  const out = [], stock = calcularStock(), rec = recibidoPorPedido(), ep = tipo==='S' ? enPrestamoPorProducto() : {};
  const ped = tipo==='E' && f.pedido ? db.pedidos[f.pedido] : null;
  c.items.forEach((it,i)=>{
    if(!db.productos[it.producto]) return;
    if(tipo==='S'){
      const s = stock[it.producto], disp = s.cant - (ep[it.producto]||0);
      if(it.cantidad > disp + EPS) out.push({i, nivel:'err', msg:`Stock insuficiente (${fmtQ(disp)}${ep[it.producto]?`; ${fmtQ(ep[it.producto])} prestado`:''})`});
      else if(it.precio>0 && s.costoProm>0 && it.valor_unit_pen < s.costoProm) out.push({i, nivel:'wrn', msg:`Bajo el costo (S/ ${fmt(s.costoProm)})`});
    }
    if(ped){
      const li = ped.items.find(x=>x.producto===it.producto);
      if(!li){ out.push({i, nivel:'wrn', msg:'No está en el pedido'}); return; }
      const pend = pendienteLinea(ped, it.producto, rec);
      if(it.cantidad > pend + EPS) out.push({i, nivel:'wrn', msg:`Excede lo pendiente (${fmtQ(pend)})`});
      const dif = difPrecioPct(it.valor_unit, f.moneda, f.tc, ped, li.precio_pactado);
      if(it.precio>0 && Math.abs(dif) > TOLERANCIA_PRECIO) out.push({i, nivel: dif>0?'err':'wrn', msg:`${dif>0?'+':''}${fmt(dif*100,1)}% vs pactado`});
    }
  });
  return out;
}
function actualizarTotales(tipo){

}
async function guardarDoc(tipo){
  const E = tipo==='E', S = tipo==='S', P = tipo==='P', f = getForm(tipo), errores = [];
  const lineas = f.items.filter(it => it.producto || it.cantidad || it.precio);
  if(!f.fecha) errores.push('Falta la fecha.');
  if(f.fecha > hoyISO()) errores.push('La fecha no puede ser futura.');
  if(!f.tercero) errores.push(S?'Falta el cliente.':'Falta el proveedor.');
  else if(!(S?db.clientes:db.proveedores)[f.tercero]) errores.push(`${S?'El cliente':'El proveedor'} "${f.tercero}" no está registrado. Créalo con "+ Nuevo".`);
  if(!P){
    if(!String(f.serie).trim()) errores.push('Falta la serie del comprobante.');
    if(!String(f.numero).trim()) errores.push('Falta el número del comprobante.');
  }
  if(P && f.fecha_entrega && f.fecha_entrega < f.fecha) errores.push('La entrega comprometida no puede ser antes de la fecha del pedido.');
  if(!P && f.condicion==='Credito' && !(num(f.dias_credito)>=0 && String(f.dias_credito).trim()!=='')) errores.push('Indica los días de crédito.');
  if(f.moneda==='USD' && !(num(f.tc)>0)) errores.push('Falta el tipo de cambio.');
  if(!lineas.length) errores.push('Agrega al menos un producto.');
  lineas.forEach((it,i)=>{
    const p = db.productos[it.producto];
    if(!p) errores.push(`Línea ${i+1}: el producto "${it.producto}" no existe.`);
    else if(p.activo===false) errores.push(`Línea ${i+1}: el producto ${p.codigo} está inactivo.`);
    if(!(num(it.cantidad)>0)) errores.push(`Línea ${i+1}: la cantidad debe ser mayor a 0.`);
    if(num(it.precio)<0 || it.precio==='') errores.push(`Línea ${i+1}: falta el ${P?'precio pactado':E?'costo':'precio'} unitario.`);
  });
  if(P){
    const vistos = new Set();
    lineas.forEach(it=>{ if(vistos.has(it.producto)) errores.push(`El producto ${it.producto} está repetido en el pedido; súmalo en una sola línea.`); vistos.add(it.producto); });
  }
  if(!P && f.serie && f.numero && f.tercero){
    const k = claveComprobante(f.serie, f.numero);
    const dup = Object.values(E?db.entradas:db.salidas).find(d=> d.estado!=='Anulada' && claveComprobante(d.serie,d.numero)===k && (E ? d.proveedor===f.tercero : true));
    if(dup) errores.push(`El comprobante ${k} ya está registrado (${dup.codigo}). Si fue un error, anula el anterior primero.`);
  }
  const mostrar = errs => { document.getElementById('form-err').innerHTML = `<div class="alerta bad"><b>Revisa lo siguiente:</b><br>${errs.map(esc).join('<br>')}</div>`; document.getElementById('form-err').scrollIntoView({behavior:'smooth',block:'center'}); };
  if(errores.length) return mostrar(errores);

  const c = calcularDoc({...f, items:lineas});
  const doc = { codigo:'', fecha:f.fecha, moneda:f.moneda, tc:c.tc, afecto_igv:!!f.afecto_igv, precios_incluyen_igv:!!(f.afecto_igv&&f.incluye_igv), igv_pct:num(db.config.igv_pct),
    items:c.items, base:c.base, igv:c.igv, total:c.total, base_pen:c.base_pen, igv_pen:c.igv_pen, total_pen:c.total_pen,
    observacion:f.observacion.trim(), creado:new Date().toISOString() };

  if(P){
    doc.proveedor = f.tercero; doc.fecha_entrega = f.fecha_entrega || ''; doc.estado = 'Vigente';
    doc.items = c.items.map(it=>({producto:it.producto, cantidad:it.cantidad, precio:it.precio, precio_pactado:it.valor_unit, valor_total:it.valor_total}));
    doc.codigo = await siguienteCodigo('OC');
    db.pedidos[doc.codigo] = doc; formP = null;
    guardar(`Pedido ${doc.codigo} guardado`); ir('pedidos'); verPedido(doc.codigo);
    return;
  }
  Object.assign(doc, {serie:String(f.serie).trim().toUpperCase(), numero:String(f.numero).trim(), estado:'Activa'});
  if(f.condicion==='Credito'){ doc.condicion='Credito'; doc.fecha_venc=sumarDias(f.fecha, num(f.dias_credito)); doc.pagos=[]; }
  else doc.condicion='Contado';
  if(E){
    doc.proveedor = f.tercero; doc.pedido = f.pedido || '';
    if(doc.pedido){
      const ped = db.pedidos[doc.pedido];
      doc.items.forEach(it=>{ const li = ped.items.find(x=>x.producto===it.producto); if(li) it.precio_pactado = li.precio_pactado; });
      const avisos = avisosLineas('E', {...f, items:lineas}, c).filter(a=>a.nivel!=='info');
      if(avisos.length && !confirm('Hay diferencias con el pedido ' + doc.pedido + ':\n\n' + avisos.map(a=>`• ${c.items[a.i].producto}: ${a.msg}`).join('\n') + '\n\n¿Guardar la entrada de todos modos? (las diferencias quedarán registradas)')) return;
    }
  } else {
    doc.cliente = f.tercero; doc.comprobante = f.comprobante;
    const sim = {...db, salidas:{...db.salidas, __nueva:{...doc, codigo:'__nueva'}}};
    const errStock = validarStockSimulado(sim, lineas.map(i=>i.producto));
    if(errStock.length) return mostrar(['No hay stock suficiente:', ...errStock]);
    const errPrest = erroresDisponible(sim, enPrestamoPorProducto(), lineas.map(i=>i.producto));
    if(errPrest.length) return mostrar(['Parte del stock está prestado a proveedores:', ...errPrest]);
  }
  doc.codigo = await siguienteCodigo(E?'ENT':'SAL');
  (E?db.entradas:db.salidas)[doc.codigo] = doc;
  setForm(tipo, null);
  guardar(`${E?'Entrada':'Salida'} ${doc.codigo} guardada`);
  ir(RUTA[tipo].lista);
  verDoc(tipo, doc.codigo);
}

// Convierte un valor unitario de una entrada a la moneda del pedido (para comparar contra lo pactado).
function aMonedaPedido(vu, e, p){
  if(e.moneda===p.moneda) return vu;
  const pen = vu * (e.moneda==='USD' ? e.tc : 1);
  return p.moneda==='USD' ? pen/p.tc : pen;
}

async function guardarAjuste(aprobarYa){
  const f = formA, errores = [], lineas = f.items.filter(it=>it.producto||it.cantidad);
  if(!f.fecha) errores.push('Falta la fecha.');
  if(f.fecha > hoyISO()) errores.push('La fecha no puede ser futura.');
  if(f.detalle.trim().length < 5) errores.push('Escribe el detalle o sustento del ajuste.');
  if(!lineas.length) errores.push('Agrega al menos un producto.');
  lineas.forEach((it,i)=>{ if(!db.productos[it.producto]) errores.push(`Línea ${i+1}: el producto "${it.producto}" no existe.`); if(!(num(it.cantidad)>0)) errores.push(`Línea ${i+1}: la cantidad debe ser mayor a 0.`); });
  const vistos = new Set(); lineas.forEach(it=>{ if(vistos.has(it.producto)) errores.push(`El producto ${it.producto} está repetido.`); vistos.add(it.producto); });
  const aj = {codigo:'', fecha:f.fecha, motivo:f.motivo, signo:signoMotivo(f.motivo), solicitado_por:f.solicitado_por.trim(), detalle:f.detalle.trim(),
    items:lineas.map(it=>({producto:it.producto, cantidad:num(it.cantidad)})), estado:'Pendiente', creado:new Date().toISOString()};
  if(!errores.length && aj.signo<0){
    const sim = {...db, ajustes:{...db.ajustes, __n:{...aj, codigo:'__n', estado:'Aprobado'}}};
    errores.push(...validarStockSimulado(sim, aj.items.map(i=>i.producto)));
    errores.push(...erroresDisponible(sim, enPrestamoPorProducto(), aj.items.map(i=>i.producto)));
  }
  if(errores.length){ document.getElementById('form-err').innerHTML = `<div class="alerta bad"><b>Revisa lo siguiente:</b><br>${errores.map(esc).join('<br>')}</div>`; return; }
  aj.codigo = await siguienteCodigo('AJU'); db.ajustes[aj.codigo] = aj; formA = null;
  guardar(`Ajuste ${aj.codigo} registrado (pendiente)`); ir('ajustes');
  if(aprobarYa) modalAprobarAjuste(aj.codigo);
}

/* ============================== PRÉSTAMOS A PROVEEDORES (muestras para fabricar) ============================== */
// Un préstamo NO es un movimiento de kardex: la mercadería sigue siendo nuestra (mismo stock y valor),
// solo cambia de lugar. Lo prestado y no devuelto resta del "disponible en almacén", que es lo que se puede
// vender o ajustar. Si no vuelve, se cierra con un ajuste "Préstamo no devuelto" aprobado con PIN.
function devueltoPrestamo(p){
  const r = {};
  (p.devoluciones||[]).filter(d=>!d.anulado).forEach(d=>d.items.forEach(it=>r[it.producto] = (r[it.producto]||0) + it.cantidad));
  return r;
}
function estadoPrestamo(p){
  if(p.estado==='Anulado') return 'Anulado';
  const dv = devueltoPrestamo(p);
  if(p.items.every(it=>(dv[it.producto]||0) >= it.cantidad - EPS)) return 'Devuelto';
  if(p.estado==='Cerrado') return 'Cerrado con faltante';
  return p.items.some(it=>(dv[it.producto]||0) > EPS) ? 'Parcial' : 'Prestado';
}
const prestamoAbierto = p => ['Prestado','Parcial'].includes(estadoPrestamo(p));
function pendientesPrestamo(p){
  if(!prestamoAbierto(p)) return [];
  const dv = devueltoPrestamo(p);
  return p.items.map(it=>({producto:it.producto, cantidad:Math.max(0, it.cantidad-(dv[it.producto]||0))})).filter(x=>x.cantidad>EPS);
}
function enPrestamoPorProducto(){
  const out = {};
  Object.values(db.prestamos).forEach(p=>pendientesPrestamo(p).forEach(x=>out[x.producto] = (out[x.producto]||0) + x.cantidad));
  return out;
}
const prestamoAtrasado = p => prestamoAbierto(p) && p.fecha_devolucion && p.fecha_devolucion < hoyISO();
function badgeEstadoPrestamo(p){
  const e = estadoPrestamo(p), cls = {Prestado:'warn', Parcial:'warn', Devuelto:'ok', 'Cerrado con faltante':'bad', Anulado:'mut'}[e];
  return `<span class="b ${cls}">${e}</span>${prestamoAtrasado(p)?` <span class="b bad">Atrasado ${diasEntre(p.fecha_devolucion,hoyISO())} d</span>`:''}`;
}
// Valida que, después de un cambio, el stock propio alcance para cubrir lo prestado (no vender ni ajustar lo que está afuera).
function erroresDisponible(dSim, prestSim, productos){
  const movs = construirMovimientos(dSim), errores = [];
  for(const cod of new Set(productos)){
    const cant = correrKardex(movs[cod]).cant, pr = prestSim[cod]||0;
    if(pr > EPS && cant < pr - EPS) errores.push(`${cod} — ${descProducto(cod)}: quedarían ${fmtQ(pr)} unidad(es) prestadas a proveedores y solo ${fmtQ(Math.max(0,cant))} en stock propio; no alcanza.`);
  }
  return errores;
}

async function guardarPrestamo(){
  const f = formPR, errores = [], lineas = f.items.filter(it=>it.producto||it.cantidad);
  if(!f.fecha) errores.push('Falta la fecha.');
  if(f.fecha > hoyISO()) errores.push('La fecha no puede ser futura.');
  if(!db.proveedores[f.proveedor]) errores.push('Elige un proveedor registrado.');
  if(!f.fecha_devolucion) errores.push('Indica hasta cuándo debe devolverse: sin fecha, nadie lo reclama.');
  else if(f.fecha_devolucion < f.fecha) errores.push('La fecha de devolución no puede ser anterior a la entrega.');
  if(!lineas.length) errores.push('Agrega al menos un artículo.');
  const vistos = new Set();
  lineas.forEach((it,i)=>{ if(!db.productos[it.producto]) errores.push(`Línea ${i+1}: el producto "${it.producto}" no existe.`); if(!(num(it.cantidad)>0)) errores.push(`Línea ${i+1}: la cantidad debe ser mayor a 0.`);
    if(vistos.has(it.producto)) errores.push(`El producto ${it.producto} está repetido.`); vistos.add(it.producto); });
  if(!errores.length){
    const ep = enPrestamoPorProducto(); lineas.forEach(it=> ep[it.producto] = (ep[it.producto]||0) + num(it.cantidad));
    errores.push(...erroresDisponible(db, ep, lineas.map(it=>it.producto)));
  }
  if(errores.length){ document.getElementById('form-err').innerHTML = `<div class="alerta bad"><b>Revisa lo siguiente:</b><br>${errores.map(esc).join('<br>')}</div>`; return; }
  const p = {codigo:await siguienteCodigo('PRE'), fecha:f.fecha, proveedor:f.proveedor, pedido:f.pedido||'', fecha_devolucion:f.fecha_devolucion, proposito:f.proposito.trim(),
    autorizado_por:f.autorizado_por.trim(), recibe_nombre:f.recibe_nombre.trim(), recibe_dni:f.recibe_dni.trim(), observacion:f.observacion.trim(),
    items:lineas.map(it=>({producto:it.producto, cantidad:num(it.cantidad)})), devoluciones:[], estado:'Vigente', creado:new Date().toISOString()};
  db.prestamos[p.codigo] = p; formPR = null;
  guardar(`Préstamo ${p.codigo} registrado`); ir('prestamos'); verPrestamo(p.codigo);
}

    </div>

      ${p.items.map(it=>{ const pend = abierto ? Math.max(0, it.cantidad-(dv[it.producto]||0)) : 0, cu = stock[it.producto]?.costoProm || stock[it.producto]?.ultProm || 0;

function guardarDevolucion(cod){
  const p = db.prestamos[cod], pend = pendientesPrestamo(p), err = document.getElementById('dv-err');
  const fecha = document.getElementById('dv-fecha').value;
  if(!fecha) return err.textContent = 'Falta la fecha.';
  if(fecha < p.fecha) return err.textContent = 'La fecha no puede ser anterior al préstamo.';
  if(fecha > hoyISO()) return err.textContent = 'La fecha no puede ser futura.';
  const items = [];
  for(let i=0;i<pend.length;i++){
    const q = num(document.getElementById('dv-q-'+i).value);
    if(q < 0) return err.textContent = 'Las cantidades no pueden ser negativas.';
    if(q > pend[i].cantidad + EPS) return err.textContent = `${pend[i].producto}: no puede devolver más de lo pendiente (${fmtQ(pend[i].cantidad)}).`;
    if(q > EPS) items.push({producto:pend[i].producto, cantidad:q});
  }
  if(!items.length) return err.textContent = 'Indica al menos una cantidad devuelta.';
  p.devoluciones = p.devoluciones || [];
  p.devoluciones.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), fecha, items, recibido_por:document.getElementById('dv-rec').value.trim(), observacion:document.getElementById('dv-obs').value.trim(), creado:new Date().toISOString()});
  guardar('Devolución registrada'); renderTodo(); verPrestamo(cod);
}
function anularDevolucion(cod, id){
  const p = db.prestamos[cod], d = p.devoluciones.find(x=>x.id===id);
  // Al anular, esas unidades vuelven a contar como "fuera del almacén": verificar que no se hayan vendido ya.
  d.anulado = true;
  const errs = erroresDisponible(db, enPrestamoPorProducto(), d.items.map(i=>i.producto));
  if(errs.length){ d.anulado = false; return alert('No se puede anular la devolución:\n' + errs.join('\n')); }
  d.anulado = false;
  if(!confirm('¿Anular esta devolución? Las unidades volverán a figurar como prestadas.')) return;
  d.anulado = true; d.fecha_anulacion = new Date().toISOString();
  guardar('Devolución anulada'); renderTodo(); verPrestamo(cod);
}

/* ============================== COBROS Y PAGOS (ventas, compras y gastos al crédito) ============================== */
// Contado = cobrado/pagado completo en la fecha del documento. Crédito = vence en fecha_venc y se paga con
// registros en d.pagos [{id, fecha, monto (moneda del doc), medio, ref, anulado?}]. Los pagos se anulan, no se borran.
const anulado = d => d.estado==='Anulada' || d.estado==='Anulado';
const esCredito = d => d.condicion==='Credito';
const pagosActivos = d => (d.pagos||[]).filter(p=>!p.anulado);
function pagadoDoc(d){ return esCredito(d) ? r2(pagosActivos(d).reduce((a,p)=>a+p.monto,0)) : d.total; }
function saldoDoc(d){ return anulado(d) || !esCredito(d) ? 0 : r2(d.total - pagadoDoc(d)); }
const venceDoc = d => d.fecha_venc || d.fecha;
// Movimientos de caja (S/) de un documento. Los pagos en US$ se convierten al T.C. del documento
// (no se calcula diferencia de cambio).
function cajaDoc(d){
  if(anulado(d)) return [];
  if(!esCredito(d)) return [{fecha:d.fecha, pen:d.total_pen}];
  return pagosActivos(d).map(p=>({fecha:p.fecha, pen:r2(p.monto*(d.tc||1))}));
}
function documentosPorCobrar(){ return Object.values(db.salidas).filter(d=>saldoDoc(d)>0.005); }
function documentosPorPagar(){ return [...Object.values(db.entradas).map(d=>({col:'entradas', d})), ...Object.values(db.gastos).map(d=>({col:'gastos', d}))].filter(x=>saldoDoc(x.d)>0.005); }
const terceroDoc = (col, d) => col==='salidas' ? nombreCliente(d.cliente) : col==='entradas' ? nombreProveedor(d.proveedor) : (d.proveedor_nombre || nombreProveedor(d.proveedor_ruc) || '—');
const compDoc = (col, d) => col==='gastos' ? `${d.comprobante}${d.serie_numero?' '+d.serie_numero:''}` : `${d.serie}-${d.numero}`;
function htmlPagos(col, d){
  if(!esCredito(d)) return `<p class="hint">Condición: <b>Contado</b> (${col==='salidas'?'cobrado':'pagado'} en la fecha del documento).</p>`;
  const cob = col==='salidas', ps = d.pagos||[], vencido = saldoDoc(d)>0.005 && venceDoc(d)<hoyISO();
  return `<h3 class="sec" style="margin-top:12px">${cob?'Cobros':'Pagos'} · Crédito, vence ${fmtFecha(d.fecha_venc)} ${vencido?`<span class="b bad">Vencido ${diasEntre(d.fecha_venc,hoyISO())} d</span>`:''}</h3>
    ${ps.length?`<table class="t"><thead><tr><th>Fecha</th><th>Medio</th><th>Referencia</th><th class="n">Monto</th><th></th></tr></thead><tbody>
      ${ps.map(p=>`<tr style="${p.anulado?'text-decoration:line-through;color:var(--muted)':''}"><td>${fmtFecha(p.fecha)}</td><td>${esc(p.medio)}</td><td>${esc(p.ref)}</td><td class="n">${money(p.monto,d.moneda)}</td>
        <td>${p.anulado?'<span class="b mut">Anulado</span>':(anulado(d)?'':`<button class="btn sec sm" onclick="anularPago('${col}',${ja(d.codigo)},${ja(p.id)})">Anular</button>`)}</td></tr>`).join('')}</tbody></table>`
      :`<p class="hint">Aún no hay ${cob?'cobros':'pagos'} registrados.</p>`}
    <p>${cob?'Cobrado':'Pagado'}: <b>${money(pagadoDoc(d),d.moneda)}</b> · Saldo: <b style="color:${saldoDoc(d)>0.005?'var(--bad)':'var(--ok)'}">${money(saldoDoc(d),d.moneda)}</b></p>`;
}
function reabrirDetalle(col, cod){ if(col==='gastos') verGasto(cod); else verDoc(col==='entradas'?'E':'S', cod); }
function modalPago(col, cod){
  const d = db[col][cod], cob = col==='salidas';
  abrirModal(`Registrar ${cob?'cobro':'pago'} · ${compDoc(col,d)}`, `
    <p>${esc(terceroDoc(col,d))} · Total ${money(d.total,d.moneda)} · Saldo <b>${money(saldoDoc(d),d.moneda)}</b> · vence ${fmtFecha(d.fecha_venc)}</p>
    <div class="row">
      <div class="field"><label>Fecha</label><input type="date" id="pg-fecha" value="${hoyISO()}"></div>
      <div class="field"><label>Monto (${d.moneda==='USD'?'US$':'S/'})</label><input type="number" step="0.01" min="0" class="num" id="pg-monto" value="${saldoDoc(d)}"></div>
      <div class="field"><label>Medio</label><select id="pg-medio">${MEDIOS_PAGO.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="field w2"><label>Referencia (N° de operación, banco…)</label><input id="pg-ref"></div>
    </div><div id="pg-err" class="err"></div>`,
    `<button class="btn sec" onclick="reabrirDetalle('${col}',${ja(cod)})">Volver</button><button class="btn ok" onclick="guardarPago('${col}',${ja(cod)})">Registrar ${cob?'cobro':'pago'}</button>`);
}
function guardarPago(col, cod){
  const d = db[col][cod], err = document.getElementById('pg-err');
  const fecha = document.getElementById('pg-fecha').value, monto = r2(num(document.getElementById('pg-monto').value));
  if(!fecha) return err.textContent = 'Falta la fecha.';
  if(fecha < d.fecha) return err.textContent = 'La fecha no puede ser anterior a la del documento.';
  if(fecha > hoyISO()) return err.textContent = 'La fecha no puede ser futura.';
  if(!(monto>0)) return err.textContent = 'El monto debe ser mayor a 0.';
  if(monto > saldoDoc(d) + 0.005) return err.textContent = `El monto supera el saldo (${fmt(saldoDoc(d))}).`;
  d.pagos = d.pagos || [];
  d.pagos.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), fecha, monto, medio:document.getElementById('pg-medio').value, ref:document.getElementById('pg-ref').value.trim(), creado:new Date().toISOString()});
  guardar(col==='salidas' ? 'Cobro registrado' : 'Pago registrado'); renderTodo(); reabrirDetalle(col, cod);
}
function anularPago(col, cod, id){
  if(!confirm('¿Anular este registro? Quedará tachado en el historial y el monto volverá a quedar pendiente.')) return;
  const p = db[col][cod].pagos.find(x=>x.id===id); p.anulado = true; p.fecha_anulacion = new Date().toISOString();
  guardar('Registro anulado'); renderTodo(); reabrirDetalle(col, cod);
}

/* ============================== CUENTAS POR COBRAR / POR PAGAR ============================== */
function renderCuentas(tipo){
  const C = tipo==='cxc', hoy = hoyISO();
  let docs = C ? documentosPorCobrar().map(d=>({col:'salidas', d})) : documentosPorPagar();
  const terceros = [...new Set(docs.map(x=>terceroDoc(x.col,x.d)))].sort();
  if(filtCx.tercero && !terceros.includes(filtCx.tercero)) filtCx.tercero = '';
  docs = docs.filter(x=>!filtCx.tercero || terceroDoc(x.col,x.d)===filtCx.tercero).sort((a,b)=>venceDoc(a.d).localeCompare(venceDoc(b.d)));
  const tramos = [['Por vencer',-Infinity,0],['Vencido 1–30 d',1,30],['Vencido 31–60 d',31,60],['Vencido 61–90 d',61,90],['Vencido +90 d',91,Infinity]];
  const tot = {}; let total = 0;
  docs.forEach(x=>{ const dv = diasEntre(venceDoc(x.d), hoy), pen = saldoDoc(x.d)*(x.d.tc||1); total += pen; const t = tramos.find(([,a,b])=>dv>=a && dv<=b); tot[t[0]] = (tot[t[0]]||0) + pen; });
  document.getElementById('main').innerHTML = `
    <div class="toolbar"><div><h2>${C?'Cuentas por cobrar':'Cuentas por pagar'}</h2><p class="desc" style="margin:0">${C?'Ventas al crédito con saldo pendiente, de la más próxima a vencer a la más lejana.':'Compras de mercadería y gastos al crédito con saldo pendiente.'} Montos con IGV; en S/ al tipo de cambio de cada documento.</p></div>
      <button class="btn sec" onclick="exportarCuentasCSV('${tipo}')">Exportar a Excel</button></div>
    <div class="kpis">
      <div class="kpi"><div class="l">Total ${C?'por cobrar':'por pagar'}</div><div class="v">${money(total)}</div><div class="s">${docs.length} documento(s)</div></div>
      ${tramos.map(([t])=>`<div class="kpi ${t!=='Por vencer'&&tot[t]?'bad':''}"><div class="l">${t}</div><div class="v">${money(tot[t]||0)}</div><div class="s">${total?fmt((tot[t]||0)/total*100,0)+'% del total':''}</div></div>`).join('')}
    </div>
    <div class="card"><div class="row"><div class="field w2" style="max-width:420px"><label>${C?'Cliente':'Proveedor'}</label><select onchange="filtCx.tercero=this.value;renderCuentas('${tipo}')"><option value="">Todos</option>${terceros.map(t=>`<option ${filtCx.tercero===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div></div>
    <div class="card tbl-wrap">
      ${docs.length ? `<table class="t"><thead><tr><th>Vence</th><th>Situación</th><th>${C?'Cliente':'Proveedor'}</th>${C?'':'<th>Tipo</th>'}<th>Comprobante</th><th>Emisión</th><th>Mon.</th><th class="n">Total</th><th class="n">${C?'Cobrado':'Pagado'}</th><th class="n">Saldo</th><th class="n">Saldo S/</th><th></th></tr></thead><tbody>
        ${docs.map(({col,d})=>{ const dv = diasEntre(venceDoc(d), hoy); return `<tr>
          <td>${fmtFecha(venceDoc(d))}</td><td>${dv>0?`<span class="b bad">Vencido ${dv} d</span>`:dv===0?'<span class="b warn">Vence hoy</span>':`<span class="b info">En ${-dv} d</span>`}</td>
          <td>${esc(terceroDoc(col,d))}</td>${C?'':`<td>${col==='entradas'?'Mercadería':esc(d.categoria)}</td>`}<td class="mono">${esc(compDoc(col,d))}</td><td>${fmtFecha(d.fecha)}</td><td>${d.moneda==='USD'?'US$':'S/'}</td>
          <td class="n">${fmt(d.total)}</td><td class="n">${fmt(pagadoDoc(d))}</td><td class="n"><b>${fmt(saldoDoc(d))}</b></td><td class="n">${fmt(saldoDoc(d)*(d.tc||1))}</td>
          <td style="white-space:nowrap"><button class="btn ok sm" onclick="modalPago('${col}',${ja(d.codigo)})">${C?'Cobrar':'Pagar'}</button> <button class="btn sec sm" onclick="reabrirDetalle('${col}',${ja(d.codigo)})">Ver</button></td></tr>`; }).join('')}
        </tbody><tfoot><tr><td colspan="${C?9:10}">Total</td><td class="n">${fmt(total)}</td><td></td></tr></tfoot></table>`
      : `<div class="empty">No hay saldos pendientes${filtCx.tercero?' para este '+(C?'cliente':'proveedor'):''}.</div>`}
    </div>`;
}
function exportarCuentasCSV(tipo){
  const C = tipo==='cxc', docs = C ? documentosPorCobrar().map(d=>({col:'salidas', d})) : documentosPorPagar();
  descargarCSV(`${C?'por_cobrar':'por_pagar'}_${hoyISO()}.csv`, ['Vence','Días vencido',C?'Cliente':'Proveedor','Tipo','Comprobante','Emisión','Moneda','Total','Pagado','Saldo','Saldo S/'],
    docs.map(({col,d})=>[venceDoc(d), Math.max(0,diasEntre(venceDoc(d),hoyISO())), terceroDoc(col,d), col==='salidas'?'Venta':col==='entradas'?'Mercadería':d.categoria, compDoc(col,d), d.fecha, d.moneda, d.total, pagadoDoc(d), saldoDoc(d), r2(saldoDoc(d)*(d.tc||1))]));
}

const categoriasGasto = () => db.config.categorias_gasto;
function lineaDeCategoria(nombre, fallback){ return (categoriasGasto().find(c=>c.nombre===nombre)||{}).linea || fallback || 'otros'; }
function optsCategoriaGasto(sel){
  return Object.entries(LINEAS_EERR).map(([k,l])=>{ const cs = categoriasGasto().filter(c=>c.linea===k);
    return cs.length ? `<optgroup label="${esc(l)}">${cs.map(c=>`<option ${c.nombre===sel?'selected':''}>${esc(c.nombre)}</option>`).join('')}</optgroup>` : ''; }).join('');
}
// Arma el registro de un gasto. Si es factura con crédito fiscal, al EERR va solo la base (el IGV se recupera);
// en cualquier otro caso el gasto es el total pagado.
function construirGasto(x){
  const pct = num(db.config.igv_pct)/100, tc = x.moneda==='USD' ? num(x.tc) : 1, total = r2(num(x.monto));
  const cf = x.comprobante==='Factura' && !!x.credito_fiscal;
  const base = cf ? r2(total/(1+pct)) : total, igv = r2(total-base);
  const g = { fecha:x.fecha, categoria:x.categoria, linea:lineaDeCategoria(x.categoria), descripcion:String(x.descripcion||'').trim(),
    proveedor_ruc:String(x.proveedor_ruc||'').trim(), proveedor_nombre:String(x.proveedor_nombre||'').trim(),
    comprobante:x.comprobante, serie_numero:String(x.serie_numero||'').trim().toUpperCase(), moneda:x.moneda, tc,
    credito_fiscal:cf, igv_pct:num(db.config.igv_pct), base, igv, total, base_pen:r2(base*tc), igv_pen:r2(igv*tc), total_pen:r2(total*tc), gasto_pen:r2(base*tc),
    condicion: x.condicion==='Credito' ? 'Credito' : 'Contado', estado:'Activo', creado:new Date().toISOString() };
  if(g.condicion==='Credito'){ g.fecha_venc = sumarDias(x.fecha, num(x.dias)); g.pagos = []; }
  return g;
}

async function guardarGasto(){
  const x = leerFormGasto(), err = document.getElementById('g-err'), errores = [];
  if(!x.fecha) errores.push('Falta la fecha.');
  if(x.fecha > hoyISO()) errores.push('La fecha no puede ser futura.');
  if(!x.categoria) errores.push('Elige una categoría.');
  if(!x.descripcion.trim()) errores.push('Escribe una descripción.');
  if(!(num(x.monto)>0)) errores.push('El monto debe ser mayor a 0.');
  if(x.moneda==='USD' && !(num(x.tc)>0)) errores.push('Falta el tipo de cambio.');
  if(x.proveedor_ruc.trim() && !/^\d{11}$/.test(x.proveedor_ruc.trim())) errores.push('El RUC debe tener 11 dígitos (o déjalo vacío).');
  if(x.condicion==='Credito' && String(x.dias).trim()==='') errores.push('Indica los días de crédito.');
  if(x.serie_numero.trim() && x.proveedor_ruc.trim()){
    const dup = Object.values(db.gastos).find(g=>!anulado(g) && g.proveedor_ruc===x.proveedor_ruc.trim() && g.serie_numero===x.serie_numero.trim().toUpperCase());
    if(dup) errores.push(`Ese comprobante ya está registrado (${dup.codigo}).`);
  }
  if(errores.length){ err.innerHTML = errores.map(esc).join('<br>'); return; }
  const g = construirGasto(x); g.codigo = await siguienteCodigo('GAS'); db.gastos[g.codigo] = g;
  guardar(`Gasto ${g.codigo} guardado`); cerrarModal(); renderTodo();
}

/* ============================== ESTADO DE RESULTADOS ============================== */
// Resultado de un período (prefijo 'AAAA-MM' o 'AAAA-'), en soles sin IGV.
function resultadosPeriodo(pref, costos){
  const r = {ventas:0, costo:0, ajustes:0, compras:0, lineas:{}, cats:{}, igvDeb:0, igvCompras:0, igvGastos:0};
  for(const s of Object.values(db.salidas)) if(!anulado(s) && s.fecha.startsWith(pref)){ r.ventas += s.base_pen; r.costo += costos[s.codigo]||0; r.igvDeb += s.igv_pen; }
  for(const e of Object.values(db.entradas)) if(!anulado(e) && e.fecha.startsWith(pref)){ r.compras += e.base_pen; r.igvCompras += e.igv_pen; }
  for(const a of Object.values(db.ajustes)) if(a.estado==='Aprobado' && a.fecha.startsWith(pref)) r.ajustes += -a.signo*(costos[a.codigo]||0); // pérdida = positivo
  for(const g of Object.values(db.gastos)) if(!anulado(g) && g.fecha.startsWith(pref)){
    const l = lineaDeCategoria(g.categoria, g.linea);
    r.lineas[l] = (r.lineas[l]||0) + g.gasto_pen; r.cats[l+'|'+g.categoria] = (r.cats[l+'|'+g.categoria]||0) + g.gasto_pen; r.igvGastos += g.igv_pen;
  }
  const L = k => r.lineas[k]||0;
  r.margen = r.ventas - r.costo;
  r.gastosOp = LINEAS_OPERATIVAS.reduce((a,k)=>a+L(k),0);
  r.utilOp = r.margen - r.ajustes - r.gastosOp;
  r.financieros = L('financieros'); r.utilAI = r.utilOp - r.financieros; r.inversion = L('inversion');
  return r;
}
function filasEERR(tot){
  const subs = k => Object.keys(tot.cats).filter(x=>x.startsWith(k+'|')).sort().map(x=>({label:x.split('|')[1], get:r=>r.cats[x]||0, cls:'sub'}));
  const rows = [
    {label:'Ventas netas', get:r=>r.ventas, cls:'bold'},
    {label:'(−) Costo de ventas', get:r=>r.costo},
    {label:'= Margen bruto', get:r=>r.margen, cls:'total'},
    {label:'% margen bruto', get:r=>r.ventas?r.margen/r.ventas:null, cls:'pct'},
    {label:'(−) Mermas y ajustes de inventario', get:r=>r.ajustes},
  ];
  LINEAS_OPERATIVAS.forEach(k=>{ rows.push({label:'(−) '+LINEAS_EERR[k], get:r=>r.lineas[k]||0}); rows.push(...subs(k)); });
  rows.push({label:'= Utilidad operativa', get:r=>r.utilOp, cls:'total'}, {label:'% margen operativo', get:r=>r.ventas?r.utilOp/r.ventas:null, cls:'pct'},
    {label:'(−) Gastos financieros', get:r=>r.financieros}, ...subs('financieros'),
    {label:'= Utilidad antes de impuestos', get:r=>r.utilAI, cls:'total'},
    {label:'Para referencia (no forman parte del resultado)', cls:'head'},
    {label:'Compras de mercadería (van al inventario)', get:r=>r.compras, cls:'memo'},
    {label:'Inversión / implementación', get:r=>r.inversion, cls:'memo'}, ...subs('inversion').map(x=>({...x, cls:'sub memo'})));
  return rows;
}
function renderEERR(){
  const costos = costosPorDoc(), a = anioEERR, hoy = new Date();
  const futuro = m => a > hoy.getFullYear() || (a===hoy.getFullYear() && m > hoy.getMonth()+1);
  const meses = Array.from({length:12}, (_,i)=>resultadosPeriodo(prefijoPeriodo(a,i+1), costos));
  const tot = resultadosPeriodo(`${a}-`, costos), cols = [...meses, tot];
  const celda = (v, cls, i) => {
    if(i<12 && futuro(i+1)) return '<td class="n"></td>';
    if(cls && cls.includes('pct')) return `<td class="n hint">${v==null?'':fmt(v*100,1)+'%'}</td>`;
    if(Math.abs(v)<0.5) return '<td class="n hint">–</td>';
    const neg = cls && cls.includes('total') && v<0;
    return `<td class="n" style="${neg?'color:var(--bad)':''}">${fmt(v,0)}</td>`;
  };
  const estilo = cls => cls==='total' ? 'font-weight:700;background:var(--soft)' : cls==='bold' ? 'font-weight:700' : cls && cls.includes('sub') ? 'color:var(--muted);font-size:12px' : cls && cls.includes('memo') ? 'color:var(--muted)' : '';
  const rows = filasEERR(tot);
  // Cuadro de IGV: débito − crédito (compras + gastos con crédito fiscal), arrastrando el saldo a favor mes a mes.
  let favor = 0; const igv = meses.map((r,i)=>{ const ant = favor, neto = r.igvDeb - r.igvCompras - r.igvGastos - ant; const pagar = Math.max(0,neto); favor = Math.max(0,-neto); return {deb:r.igvDeb, cc:r.igvCompras, cg:r.igvGastos, ant, pagar, favor, f:futuro(i+1)}; });

// Lo que realmente entra y sale (con IGV): ventas al contado + cobros; compras y gastos al contado + pagos.
function cajaPeriodo(pref){
  const r = {cobros:0, pagosMerc:0, lineas:{}};
  for(const s of Object.values(db.salidas)) cajaDoc(s).forEach(m=>{ if(m.fecha.startsWith(pref)) r.cobros += m.pen; });
  for(const e of Object.values(db.entradas)) cajaDoc(e).forEach(m=>{ if(m.fecha.startsWith(pref)) r.pagosMerc += m.pen; });
  for(const g of Object.values(db.gastos)){ const l = lineaDeCategoria(g.categoria, g.linea); cajaDoc(g).forEach(m=>{ if(m.fecha.startsWith(pref)) r.lineas[l] = (r.lineas[l]||0) + m.pen; }); }
  r.salidasTot = r.pagosMerc + Object.values(r.lineas).reduce((a,b)=>a+b,0);
  r.otros = {}; // tipo de "otro movimiento de caja" → monto con signo (S/)
  for(const m of Object.values(db.movcaja)) if(!anulado(m) && m.fecha.startsWith(pref)) r.otros[m.tipo] = (r.otros[m.tipo]||0) + m.signo*m.monto_pen;

}
