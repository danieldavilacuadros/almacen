/* ============================== INDICADORES (gerencia) ============================== */
function rangoPeriodo(anio, mes){
  const desde = mes ? `${anio}-${String(mes).padStart(2,'0')}-01` : `${anio}-01-01`;
  let hasta = mes ? isoDe(new Date(anio, mes, 0)) : `${anio}-12-31`;
  if(hasta > hoyISO()) hasta = hoyISO();
  return {desde, hasta, dias: Math.max(1, diasEntre(desde, hasta) + 1)};
}
// Valor del inventario (S/) al cierre de cada fecha indicada, según el kardex.
function valoresInventario(movs, fechas){
  const res = fechas.map(()=>0);
  for(const cod in movs){
    const filas = correrKardex(movs[cod]).filas;
    fechas.forEach((f,j)=>{ let v = 0; for(const r of filas){ if(r.fecha <= f) v = r.saldoVal; else break; } res[j] += v; });
  }
  return res;
}
// Días promedio ponderados por monto entre la emisión y cada cobro/pago de documentos al crédito.
function diasPromedioPago(docs, desde, hasta){
  let s = 0, w = 0;
  docs.forEach(d=>{ if(anulado(d) || !esCredito(d)) return; pagosActivos(d).forEach(p=>{ if(p.fecha>=desde && p.fecha<=hasta){ const m = p.monto*(d.tc||1); s += m*diasEntre(d.fecha,p.fecha); w += m; } }); });
  return w ? s/w : null;
}
function calcularIndicadores(anio, mes){
  const {desde, hasta, dias} = rangoPeriodo(anio, mes), enRango = f => f>=desde && f<=hasta;
  const movs = construirMovimientos(db), stock = calcularStock(), costos = costosPorDoc(), hoy = hoyISO();
  // Ventas, costo y margen por producto (desde el kardex: precio y costo de cada salida)
  const prod = {};
  for(const cod in movs) for(const r of correrKardex(movs[cod]).filas){
    if(r.tipo!=='S' || !enRango(r.fecha)) continue;
    const x = prod[cod] = prod[cod] || {cant:0, ventas:0, costo:0}; x.cant += r.cantidad; x.ventas += r.cantidad*r.precio_unit; x.costo += r.costoT;
  }
  const totVentas = Object.values(prod).reduce((s,x)=>s+x.ventas,0), totCosto = Object.values(prod).reduce((s,x)=>s+x.costo,0);
  // ABC: A = productos que suman el primer 80% de la venta, B hasta el 95%, C el resto
  let acum = 0;
  const abc = Object.entries(prod).sort((a,b)=>b[1].ventas-a[1].ventas).map(([cod,x])=>{
    const previo = totVentas ? acum/totVentas : 0; acum += x.ventas;
    const clase = previo < 0.8 ? 'A' : previo < 0.95 ? 'B' : 'C';
    const s = stock[cod], cd = x.cant/dias;
    return {cod, ...x, margen:x.ventas-x.costo, pct: totVentas?x.ventas/totVentas:0, acum: totVentas?acum/totVentas:0, clase, stockVal:s?.val||0, stockCant:s?.cant||0, diasInv: cd>0 ? (s?.cant||0)/cd : null};
  });
  const valTotal = Object.values(stock).reduce((s,x)=>s+x.val,0);
  const resumenABC = ['A','B','C'].map(c=>{ const it = abc.filter(x=>x.clase===c); return {clase:c, n:it.length, ventas:it.reduce((s,x)=>s+x.ventas,0), stock:it.reduce((s,x)=>s+x.stockVal,0)}; });
  const conVenta = new Set(abc.map(x=>x.cod));
  const stockSinVenta = Object.entries(stock).filter(([c,s])=>s.val>EPS && !conVenta.has(c)).reduce((a,[,s])=>a+s.val,0);
  resumenABC.push({clase:'Sin venta', n:Object.entries(stock).filter(([c,s])=>s.cant>EPS && !conVenta.has(c)).length, ventas:0, stock:stockSinVenta});
  // Inventario sin movimiento (a hoy): con stock y sin ventas hace 90+ días
  const sinMov = productosActivos().map(p=>{ const s = stock[p.codigo], ref = s.ultSalida || s.ultEntrada; return {p, s, ref, d: ref ? diasEntre(ref, hoy) : null}; })

  for(let d = new Date(desde+'T00:00:00'); ; ){ d = new Date(d.getFullYear(), d.getMonth()+1, 0); const iso = isoDe(d); if(iso >= hasta) break; puntos.push(iso); d = new Date(d.getFullYear(), d.getMonth()+1, 1); }
  puntos.push(hasta);
  const vals = valoresInventario(movs, puntos), invProm = vals.reduce((a,b)=>a+b,0)/vals.length;
  const diasInv = totCosto>0 ? invProm/(totCosto/dias) : null;
  // Clientes
  const cli = {};
  Object.values(db.salidas).filter(s=>!anulado(s) && enRango(s.fecha)).forEach(s=>{ const x = cli[s.cliente] = cli[s.cliente] || {n:0, ventas:0, costo:0, credito:0}; x.n++; x.ventas += s.base_pen; x.costo += costos[s.codigo]||0; if(esCredito(s)) x.credito += s.base_pen; });
  const porCobrarCli = {}; documentosPorCobrar().forEach(d=>porCobrarCli[d.cliente] = (porCobrarCli[d.cliente]||0) + saldoDoc(d)*(d.tc||1));
  const clientes = Object.entries(cli).map(([doc,x])=>({doc, ...x, margen:x.ventas-x.costo, porCobrar:porCobrarCli[doc]||0,
    dso: diasPromedioPago(Object.values(db.salidas).filter(s=>s.cliente===doc), desde, hasta)})).sort((a,b)=>b.ventas-a.ventas);
  // Proveedores
  const prv = {};
  Object.values(db.entradas).filter(e=>!anulado(e) && enRango(e.fecha)).forEach(e=>{
    const x = prv[e.proveedor] = prv[e.proveedor] || {compras:0, entregas:0, aTiempo:0, conFecha:0, difW:0, difS:0};
    x.compras += e.base_pen; x.entregas++;
    const ped = e.pedido && db.pedidos[e.pedido];
    if(ped && ped.fecha_entrega){ x.conFecha++; if(e.fecha <= ped.fecha_entrega) x.aTiempo++; }
    if(ped) e.items.forEach(it=>{ if(it.precio_pactado>0){ const w = it.valor_total*e.tc; x.difS += w*difPrecioPct(it.valor_unit, e.moneda, e.tc, ped, it.precio_pactado); x.difW += w; } });
  });
  const rec = recibidoPorPedido();
  Object.values(db.pedidos).filter(p=>p.estado!=='Anulado' && enRango(p.fecha)).forEach(p=>{
    const x = prv[p.proveedor] = prv[p.proveedor] || {compras:0, entregas:0, aTiempo:0, conFecha:0, difW:0, difS:0};
    x.pedQ = (x.pedQ||0) + p.items.reduce((s,i)=>s+i.cantidad,0);
    x.recQ = (x.recQ||0) + p.items.reduce((s,i)=>s+Math.min(i.cantidad,(rec[p.codigo]||{})[i.producto]||0),0);
  });
  const porPagarPrv = {}; documentosPorPagar().filter(x=>x.col==='entradas').forEach(({d})=>porPagarPrv[d.proveedor] = (porPagarPrv[d.proveedor]||0) + saldoDoc(d)*(d.tc||1));
  const proveedores = Object.entries(prv).map(([ruc,x])=>({ruc, ...x, puntualidad: x.conFecha ? x.aTiempo/x.conFecha : null, cumplimiento: x.pedQ ? x.recQ/x.pedQ : null,
    difPrecio: x.difW ? x.difS/x.difW : null, porPagar:porPagarPrv[ruc]||0})).sort((a,b)=>b.compras-a.compras);
  const entregasFecha = proveedores.reduce((s,x)=>s+x.conFecha,0), entregasOk = proveedores.reduce((s,x)=>s+x.aTiempo,0);
  const rp = resultadosPeriodo(prefijoPeriodo(anio, mes), costos);
  const salPer = Object.values(db.salidas).filter(s=>!anulado(s) && enRango(s.fecha));
  const ventasCredito = salPer.filter(esCredito).reduce((s,x)=>s+x.base_pen,0);
  return { desde, hasta, dias, rp, abc, resumenABC, valTotal, sinMov, invProm, diasInv, rotacion: invProm>0 ? totCosto/invProm : null,
    clientes, proveedores, puntualidad: entregasFecha ? entregasOk/entregasFecha : null,
    dso: diasPromedioPago(Object.values(db.salidas), desde, hasta), dpo: diasPromedioPago([...Object.values(db.entradas), ...Object.values(db.gastos)], desde, hasta),
    pctCredito: rp.ventas ? ventasCredito/rp.ventas : 0 };
}
// Serie mensual de los últimos 12 meses que terminan en el mes de 'hasta'.
function serieMensual(hasta){
  const costos = costosPorDoc(), d = new Date(hasta+'T00:00:00'), out = [];
  for(let i=11; i>=0; i--){ const m = new Date(d.getFullYear(), d.getMonth()-i, 1); const r = resultadosPeriodo(prefijoPeriodo(m.getFullYear(), m.getMonth()+1), costos);
    out.push({etiqueta:`${MESES[m.getMonth()].slice(0,3)} ${String(m.getFullYear()).slice(2)}`, ventas:r.ventas, margen:r.margen, gastos:r.gastosOp+r.ajustes, util:r.utilOp}); }

/* --- gráficos SVG livianos (sin librerías): una sola escala Y, marcas finas, tooltip al pasar el mouse --- */
window._charts = {};
function escalaNice(min, max, n=4){
  if(max===min){ max = min + 1; }
  const raw = (max-min)/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/mag;
  const step = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  return {min:Math.floor(min/step)*step, max:Math.ceil(max/step)*step, step};
}
const fmtCorto = v => { const a = Math.abs(v); return (v<0?'−':'') + (a>=1e6 ? fmt(a/1e6,1)+' M' : a>=1e3 ? fmt(a/1e3, a>=1e4?0:1)+' k' : fmt(a,0)); };
// En pantallas angostas el lienzo es más chico para que el texto no se achique al escalar el SVG.
const anchoChart = () => (window.innerWidth < 760 ? 420 : 900);
function chartLineas(id, etiquetas, series){

  const x = i => ml + (n===1 ? iw/2 : i*iw/(n-1)), y = v => mt + ih - (v-e.min)/(e.max-e.min)*ih;
  window._charts[id] = {etiquetas, series, x, y, W};

function chartBarras(id, etiquetas, valores, nombre){
  const W=anchoChart(), H=220, ml=54, mr=20, mt=12, mb=26, iw=W-ml-mr, ih=H-mt-mb, n=etiquetas.length;
  const e = escalaNice(Math.min(0,...valores), Math.max(0,...valores)), y = v => mt + ih - (v-e.min)/(e.max-e.min)*ih;
  const bw = iw/n, ancho = Math.min(36, bw*0.6), x = i => ml + bw*i + bw/2;
  window._charts[id] = {etiquetas, valores, nombre, x, W};
  let g = '';
  for(let v=e.min; v<=e.max+e.step/2; v+=e.step) g += `<line x1="${ml}" x2="${ml+iw}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v)<1e-9?'var(--axis)':'var(--grid)'}"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink3)">${fmtCorto(v)}</text>`;
  const y0 = y(0), r = 4;
  const barras = valores.map((v,i)=>{ if(Math.abs(v)<0.5) return ''; const h = Math.max(1, Math.abs(y(v)-y0)), x0 = x(i)-ancho/2, rr = Math.min(r, h);
    // extremo de datos redondeado, anclado a la línea base
    const d = v>0 ? `M${x0},${y0}V${y0-h+rr}Q${x0},${y0-h} ${x0+rr},${y0-h}H${x0+ancho-rr}Q${x0+ancho},${y0-h} ${x0+ancho},${y0-h+rr}V${y0}Z`
                  : `M${x0},${y0}V${y0+h-rr}Q${x0},${y0+h} ${x0+rr},${y0+h}H${x0+ancho-rr}Q${x0+ancho},${y0+h} ${x0+ancho},${y0+h-rr}V${y0}Z`;
    return `<path d="${d}" fill="${v>0?'var(--s1)':'var(--neg)'}"/>`; }).join('');
  const ejes = etiquetas.map((t,i)=>(W<800 && i%2) ? '' : `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink3)">${esc(t)}</text>`).join('');

  return `<div class="viz" id="${id}" onmouseleave="ocultarTip('${id}')"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nombre)} por mes">${g}${barras}${ejes}${hits}</svg><div class="tip" id="${id}-tip"></div></div>`;
}

// Lectura gerencial automática: qué mirar primero según los números del período.
function lecturaGerencial(k){
  const L = [], r = k.rp, mg = r.ventas ? r.margen/r.ventas : null, gp = r.ventas ? (r.gastosOp+r.ajustes)/r.ventas : null;
  if(!r.ventas) return ['Aún no hay ventas en el período: los indicadores se llenan a medida que registras operaciones.'];
  if(r.utilOp < 0) L.push(`<b>Pérdida operativa de ${money(-r.utilOp)}.</b> El margen bruto (${fmt(mg*100,1)}%) no alcanza a cubrir los gastos (${fmt(gp*100,1)}% de las ventas). Palancas: vender más volumen, subir precios en los productos A o recortar gastos fijos.`);
  else L.push(`Utilidad operativa positiva: ${money(r.utilOp)} (${fmt(r.utilOp/r.ventas*100,1)}% de las ventas).`);
  if(mg!=null && mg < 0.25) L.push(`Margen bruto bajo (${fmt(mg*100,1)}%). Revisa precios de venta y lo que pagas al proveedor (columna "vs pactado" en Proveedores).`);
  if(k.diasInv!=null && k.diasInv > 90) L.push(`Tienes <b>${fmt(k.diasInv,0)} días de inventario</b>: hay más mercadería guardada de la que vendes. Es capital inmovilizado que podría estar en caja.`);
  const c = k.resumenABC.find(x=>x.clase==='C'), sv = k.resumenABC.find(x=>x.clase==='Sin venta');
  const inmov = (c?.stock||0) + (sv?.stock||0);
  if(k.valTotal>0 && inmov/k.valTotal > 0.3) L.push(`El <b>${fmt(inmov/k.valTotal*100,0)}% del inventario</b> está en productos C o sin venta en el período: no los vuelvas a comprar y liquídalos.`);
  if(k.sinMov.length) L.push(`${k.sinMov.length} producto(s) sin venderse hace 90 días o más, por ${money(k.sinMov.reduce((s,x)=>s+x.s.val,0))}.`);
  if(k.dso!=null && k.dso > 45) L.push(`Cobras en promedio a <b>${fmt(k.dso,0)} días</b>. Ajusta el crédito de los clientes que más demoran (tabla Clientes).`);
  if(k.dso!=null && k.dpo!=null && k.dso > k.dpo + 10) L.push(`Cobras más lento (${fmt(k.dso,0)} d) de lo que pagas (${fmt(k.dpo,0)} d): financias a tus clientes con tu propia caja.`);
  if(k.puntualidad!=null && k.puntualidad < 0.8) L.push(`Solo el ${fmt(k.puntualidad*100,0)}% de las entregas de proveedores llegó a tiempo: sube los días de entrega o los días de seguridad en la reposición, o negocia con los que fallan.`);
  return L;
}

function renderReposicion(){
  const rep = calcularReposicion();
  const prods = productosActivos().filter(p=>repTodos || rep[p.codigo].sugerido>0);
  const grupos = {};
  prods.forEach(p=>{ const k = rep[p.codigo].proveedor; (grupos[k] = grupos[k] || []).push(p); });
  const claves = Object.keys(grupos).sort((a,b)=> (a?0:1)-(b?0:1) || nombreProveedor(a).localeCompare(nombreProveedor(b)));
  const c = db.config;
  document.getElementById('main').innerHTML = `
    <div class="toolbar"><div><h2>Reposición sugerida</h2><p class="desc" style="margin:0">Qué pedir y a quién, según lo que vendes y lo que tarda cada proveedor. Ajusta las cantidades y crea el pedido en un clic.</p></div>
      <label class="chk"><input type="checkbox" ${repTodos?'checked':''} onchange="repTodos=this.checked;renderReposicion()"> Mostrar todos los productos</label></div>
    <div class="alerta info"><b>Cómo se calcula:</b> consumo diario = ventas de los últimos ${DIAS_CONSUMO} días ÷ ${DIAS_CONSUMO}. Punto de reorden = consumo diario × (días de entrega del proveedor + ${fmtQ(c.dias_seguridad)} días de seguridad).
      Se sugiere pedir cuando <i>stock + en pedido</i> llega al punto de reorden o al stock mínimo, y la cantidad cubre ${fmtQ(c.dias_cobertura)} días de venta adicionales. (Días de seguridad y cobertura: en <a href="#" onclick="ir('config');return false">Configuración</a>.)</div>
    ${claves.length ? claves.map(k=>`<div class="card tbl-wrap">
      <div class="toolbar"><h3 class="sec" style="margin:0">${k?esc(nombreProveedor(k)):'Sin proveedor asignado'} ${k?`<span class="hint">· entrega en ${fmtQ(num(db.proveedores[k]?.dias_entrega))||'?'} día(s)</span>`:''}</h3>
        ${k?`<button class="btn acc sm" onclick="crearPedidoSugerido(${ja(k)})">Crear pedido con sugeridos</button>`:`<span class="hint">Asigna un proveedor habitual a estos productos para poder pedirlos.</span>`}</div>
      <table class="t"><thead><tr><th>Código</th><th>Producto</th><th class="n">Stock</th><th class="n">En pedido</th><th class="n">Consumo/día</th><th class="n">Cobertura</th><th class="n">Pto. reorden</th><th class="n">Mínimo</th><th class="n">Últ. costo S/</th><th class="n">Pedir</th></tr></thead><tbody>
      ${grupos[k].map(p=>{ const r=rep[p.codigo]; const v = sugEdit[p.codigo] ?? r.sugerido; return `<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.descripcion)}</td><td class="n">${fmtQ(r.stock)}</td><td class="n">${r.enPedido?fmtQ(r.enPedido):''}</td>
        <td class="n">${fmt(r.consumoDia,2)}</td><td class="n">${r.cobertura==null?'—':`<span class="${r.cobertura<r.lead?'err':''}">${fmtQ(Math.floor(r.cobertura))} d</span>`}</td>
        <td class="n">${fmtQ(Math.ceil(r.reorden))}</td><td class="n">${r.minimo?fmtQ(r.minimo):''}</td><td class="n">${fmt(r.costoRef)}</td>
        <td class="n"><input type="number" min="0" step="any" class="num" style="width:80px" value="${esc(v)}" oninput="sugEdit[${ja(p.codigo)}]=this.value"></td></tr>`; }).join('')}
      </tbody></table></div>`).join('')
    : `<div class="card"><div class="empty">No hay nada que reponer por ahora.</div></div>`}`;
}
function crearPedidoSugerido(ruc){
  const rep = calcularReposicion();
  const items = productosActivos().filter(p=>rep[p.codigo].proveedor===ruc).map(p=>({p, q:num(sugEdit[p.codigo] ?? rep[p.codigo].sugerido)})).filter(x=>x.q>0);
  if(!items.length) return alert('No hay cantidades a pedir para este proveedor.');
  formP = nuevoForm('P'); formP.tercero = ruc;
  const dias = num(db.proveedores[ruc]?.dias_entrega); if(dias>0) formP.fecha_entrega = sumarDias(formP.fecha, dias);
  formP.items = items.map(x=>({producto:x.p.codigo, cantidad:String(x.q), precio:String(r4(rep[x.p.codigo].costoRef))}));
  formP.observacion = 'Generado desde Reposición sugerida.';
  items.forEach(x=>delete sugEdit[x.p.codigo]);
  ir('pedido-nueva');
}

function renderKardex(){

  const badge = x => x.tipo==='E' ? '<span class="b info">Entrada</span>' : x.tipo==='S' ? '<span class="b ok">Salida</span>' : `<span class="b warn">Ajuste ${x.signo>0?'+':'−'}</span>`;
  if(p){
    const k = correrKardex(construirMovimientos(db)[p.codigo]);
    const previas = k.filas.filter(x=> f.desde && x.fecha < f.desde);
    const enRango = k.filas.filter(x=> (!f.desde || x.fecha>=f.desde) && (!f.hasta || x.fecha<=f.hasta));
    const ini = previas.length ? previas[previas.length-1] : null;

        ${enRango.map(x=>`<tr style="cursor:pointer" onclick="${x.tipo==='A'?`verAjuste(${ja(x.doc)})`:`verDoc('${x.tipo}',${ja(x.doc)})`}">
          <td>${fmtFecha(x.fecha)}</td><td>${badge(x)}</td><td class="mono">${esc(x.comp)}</td><td>${esc(x.tercero)}</td>
          ${x.signo>0?`<td class="n">${fmtQ(x.cantidad)}</td><td class="n">${fmt(x.costoU,4)}</td><td class="n">${fmt(x.costoT)}</td><td></td><td></td><td></td>`
                     :`<td></td><td></td><td></td><td class="n">${fmtQ(x.cantidad)}</td><td class="n">${fmt(x.costoU,4)}</td><td class="n">${fmt(x.costoT)}</td>`}
          <td class="n"><b>${fmtQ(x.saldoCant)}</b></td><td class="n">${fmt(x.costoProm,4)}</td><td class="n">${fmt(x.saldoVal)}</td></tr>`).join('') || `<tr><td colspan="13" class="empty">Sin movimientos en el rango.</td></tr>`}
        </tbody><tfoot><tr><td colspan="4">Totales del rango</td><td class="n">${fmtQ(tE)}</td><td></td><td class="n">${fmt(vE)}</td><td class="n">${fmtQ(tS)}</td><td></td><td class="n">${fmt(vS)}</td><td colspan="3"></td></tr></tfoot></table></div>`;

function guardarProducto(cod){

  db.productos[codigo] = { ...(db.productos[codigo]||{creado:new Date().toISOString()}), codigo, descripcion:v('mp-desc'), unidad:v('mp-und'), categoria:v('mp-cat'),

function renderProveedores(){
  const stock = calcularStock(), rec = recibidoPorPedido();
  const prods = {}; Object.values(db.productos).forEach(p=>{ const set=new Set([p.proveedor, ...stock[p.codigo].proveedores]); set.forEach(r=>{ if(r) prods[r]=(prods[r]||0)+1; }); });
  const compras = {}; Object.values(db.entradas).filter(e=>e.estado!=='Anulada').forEach(e=>{ compras[e.proveedor]=(compras[e.proveedor]||0)+e.base_pen; });
  // Puntualidad: % de entregas (entradas vinculadas a pedido con fecha comprometida) que llegaron a tiempo
  const punt = {};
  Object.values(db.entradas).filter(e=>e.estado!=='Anulada' && e.pedido && db.pedidos[e.pedido]?.fecha_entrega).forEach(e=>{
    const x = punt[e.proveedor] = punt[e.proveedor] || {n:0, ok:0}; x.n++; if(e.fecha <= db.pedidos[e.pedido].fecha_entrega) x.ok++; });
  const abiertos = {}; Object.values(db.pedidos).filter(p=>pedidoAbierto(p,rec)).forEach(p=>abiertos[p.proveedor]=(abiertos[p.proveedor]||0)+1);
  const lista = Object.values(db.proveedores).sort((a,b)=>a.razon_social.localeCompare(b.razon_social));
  document.getElementById('main').innerHTML = `
    <div class="toolbar"><div><h2>Proveedores</h2><p class="desc" style="margin:0">Identificados por RUC. "Días de entrega" alimenta el punto de reorden; la puntualidad se mide contra la fecha comprometida de cada pedido.</p></div>
      <button class="btn acc" onclick="modalProveedor()">+ Nuevo proveedor</button></div>
    <div class="card tbl-wrap">${lista.length?`<table class="t"><thead><tr><th>RUC</th><th>Razón social</th><th>Contacto</th><th>Teléfono</th><th>Correo</th><th class="n">Días entrega</th><th class="n">Productos</th><th class="n">Pedidos abiertos</th><th class="n">Puntualidad</th><th class="n">Compras acumuladas S/</th><th>Estado</th><th></th></tr></thead><tbody>
      ${lista.map(p=>{ const pu=punt[p.ruc]; return `<tr><td class="mono">${esc(p.ruc)}</td><td>${esc(p.razon_social)}</td><td>${esc(p.contacto)}</td><td>${esc(p.telefono)}</td><td>${esc(p.email)}</td><td class="n">${esc(p.dias_entrega)}</td><td class="n">${prods[p.ruc]||0}</td><td class="n">${abiertos[p.ruc]||''}</td>
        <td class="n">${pu?`<span class="${pu.ok/pu.n<0.8?'err':''}">${Math.round(pu.ok/pu.n*100)}%</span> <span class="hint">(${pu.n})</span>`:''}</td><td class="n">${fmt(compras[p.ruc]||0)}</td>
        <td>${p.activo===false?'<span class="b mut">Inactivo</span>':'<span class="b ok">Activo</span>'}</td><td><button class="btn sec sm" onclick="modalProveedor(${ja(p.ruc)})">Editar</button></td></tr>`; }).join('')}</tbody></table>`
      :`<div class="empty">No hay proveedores.</div>`}</div>`;

function guardarCliente(doc){

    if(!clave) return err.textContent='Falta el número de documento.';
    if(db.clientes[clave]) return err.textContent='Ese documento ya está registrado.';
  }
  if(!v('mc-nom')) return err.textContent='Falta el nombre.';

function guardarCategoriasGasto(){
  const err = document.getElementById('cat-err');
  const lista = catEdit.map(c=>({...c, nombre:c.nombre.trim()})).filter(c=>c.nombre || c._orig);
  if(lista.some(c=>!c.nombre)) return err.textContent = 'Hay categorías sin nombre.';
  const nombres = lista.map(c=>c.nombre.toLowerCase());
  if(new Set(nombres).size !== nombres.length) return err.textContent = 'Hay categorías con el mismo nombre.';
  if(!lista.length) return err.textContent = 'Debe quedar al menos una categoría.';
  lista.forEach(c=>{ if(c._orig){ Object.values(db.gastos).forEach(g=>{ if(g.categoria===c._orig){ g.categoria=c.nombre; g.linea=c.linea; } }); } });
  db.config.categorias_gasto = lista.map(c=>({nombre:c.nombre, linea:c.linea}));
  guardar('Categorías guardadas'); renderConfig();
}
function guardarConfig(){
  const v = id => document.getElementById(id).value.trim();
  const lista = s => [...new Set(s.split(',').map(x=>x.trim()).filter(Boolean))];
  const und = lista(v('cf-und')), cat = lista(v('cf-cat')), ser = lista(v('cf-ser').toUpperCase());
  if(!und.length || !cat.length || !ser.length) return alert('Unidades, categorías y series no pueden quedar vacías.');
  Object.assign(db.config, {empresa:v('cf-emp'), ruc:v('cf-ruc'), igv_pct:num(v('cf-igv')), tc_default:num(v('cf-tc'))||db.config.tc_default,
    dias_seguridad:Math.max(0,num(v('cf-seg'))), dias_cobertura:Math.max(0,num(v('cf-cob'))), unidades:und, categorias:cat, series_venta:ser});
  guardar('Configuración guardada'); renderTodo();
}
async function guardarPin(){
  const v = id => document.getElementById(id)?.value || '', err = document.getElementById('pin-cfg-err');
  if(db.config.pin_hash && await hashPin(v('pin-actual')) !== db.config.pin_hash){ err.textContent='El PIN actual no es correcto.'; return; }
  if(!/^\d{4,8}$/.test(v('pin-nuevo'))){ err.textContent='El PIN debe tener entre 4 y 8 dígitos.'; return; }
  if(v('pin-nuevo') !== v('pin-conf')){ err.textContent='La confirmación no coincide.'; return; }
  db.config.pin_hash = await hashPin(v('pin-nuevo'));
  guardar('PIN guardado'); renderTodo();
}

function htmlRescateLocal(){
  const loc = datosLocalesPrevios(); if(!loc) return '';

  return `<div class="alerta warn"><b>Encontré datos guardados en este navegador</b> (de cuando el sistema trabajaba sin nube): ${resumenConteos(loc.d)}, última modificación ${new Date(loc.d.actualizado).toLocaleString('es-PE')}<br>

async function subirDatosLocales(){
  const loc = datosLocalesPrevios(); if(!loc) return;
  if(!rescateArmado){ rescateArmado = true; return renderTodo(); }
  rescateArmado = false;
  await reemplazarEnNube(migrar(loc.d), 'Datos del navegador subidos a la nube');
  try{ localStorage.setItem(LS_KEY+'_subido_'+Date.now(), localStorage.getItem(LS_KEY)); localStorage.removeItem(LS_KEY); }catch(e){}

  a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download = `respaldo_almacen_${hoyISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function leerArchivoImportacion(input){
  const file = input.files[0]; input.value=''; if(!file) return;
  file.text().then(txt=>{
    let d; try{ d = JSON.parse(txt); }catch(e){ return alert('El archivo no es un JSON válido.'); }
    if(!d || typeof d!=='object' || !d.productos || !d.entradas || !d.salidas) return alert('El archivo no parece un respaldo de este sistema.');
    importPendiente = {nombre:file.name, data:migrar(d)}; importArmado=false;
    if(vista!=='archivo') ir('archivo'); else renderImportBox();
  });
}
function renderImportBox(){
  const box = document.getElementById('import-box'); if(!box) return;
  if(!importPendiente){ box.innerHTML=''; return; }
  const d = importPendiente.data;
  box.innerHTML = `<div class="alerta warn"><b>${esc(importPendiente.nombre)}</b> — ${resumenConteos(d)} (guardado ${new Date(d.actualizado).toLocaleString('es-PE')}).<br>Esto <b>reemplaza todos los datos actuales</b>.</div>
    <button class="btn danger" onclick="ejecutarImportacion()">${importArmado?'¿Confirmar? Reemplazar todo':'Restaurar este respaldo'}</button>
    <button class="btn sec" onclick="importPendiente=null;importArmado=false;renderImportBox()">Cancelar</button>`;
}
async function ejecutarImportacion(){
  if(!importArmado){ importArmado=true; return renderImportBox(); }
  const data = importPendiente.data; importPendiente=null; importArmado=false; formE=formS=formP=formA=formPR=null;
  if(NUBE) return reemplazarEnNube(data, 'Respaldo subido a la nube');
  db = data; guardar('Respaldo restaurado'); renderTodo();
}
async function armarBorrarTodo(){
  if(!borrarArmado){ borrarArmado=true; return renderArchivo(); }
  const nueva = dbVacia(); nueva.config = db.config; borrarArmado=false; formE=formS=formP=formA=formPR=null; sugEdit={};
  if(NUBE) return reemplazarEnNube(nueva, 'Datos borrados');
  db = nueva; guardar('Datos borrados'); renderTodo();
}
async function reemplazarEnNube(data, msg){
  if(pendientesNube){ alert('Espera a que terminen de subirse los cambios pendientes e intenta de nuevo.'); return; }
  document.getElementById('main').innerHTML = '<div class="card gate"><h2>Actualizando la nube…</h2><p class="desc">No cierres esta pestaña.</p></div>';
  try{ await reemplazarNube(data); toast(msg); }
  catch(e){ alert('No se pudo completar: ' + (e.message||e) + '\n\nRevisa la conexión y vuelve a intentarlo (descarga un respaldo antes).'); try{ await cargarNube(); }catch(_){} }
  renderTodo();
}

/* ============================== ARRANQUE ============================== */
async function init(){
  if(NUBE){
    db = dbVacia();
    if(!window.supabase){ nubeFase = 'error-carga'; errorCarga = 'No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.'; return renderTodo(); }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((ev, s)=>{ sesion = s; if(ev==='SIGNED_OUT' && nubeFase==='lista'){ nubeFase = 'login'; renderTodo(); } });
    const {data} = await sb.auth.getSession();
    sesion = data.session;
    if(sesion) return iniciarSesionNube();
    nubeFase = 'login'; return renderTodo();
  }
  db = cargarLocal() || dbVacia();
  if(FS_OK){
    try{
      const h = await idbGet('archivo');
      if(h){ fileHandle = h; const perm = await h.queryPermission({mode:'readwrite'}); if(perm==='granted') await leerDesdeArchivo(); else estadoArchivo='reconectar'; }
    }catch(e){ console.warn('No se pudo restaurar el archivo', e); estadoArchivo='memoria'; }
  }
  renderTodo();
}
window.addEventListener('beforeunload', e=>{ const sucio = [formE,formS,formP].some(f=>f && f.items.some(i=>i.producto)) || [formA, formPR].some(f=>f && f.items.some(i=>i.producto)) || pendientesNube || hayCambiosSinSubir(); if(sucio){ e.preventDefault(); e.returnValue=''; } });
// Errores en acciones asíncronas (p. ej. sin conexión al pedir un correlativo): mostrarlos en vez de fallar en silencio.
window.addEventListener('unhandledrejection', e=>{ console.error(e.reason); alert(e.reason?.message || String(e.reason)); });
init();
